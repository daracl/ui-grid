<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Dara selection</title>
  </head>

  <body>
    <div class="grid-view-area">
      <div id="sample" style="height: calc(100vh - 50px); width: 100%"></div>
    </div>
  </body>
</html>

<script src="./data/sampleConfig.js" type="text/javascript"></script>
<script src="./data/employee.js" type="text/javascript"></script>
<script type="module" src="/src/index.ts"></script>

<script>
  var gridObj;

  function loadGrid(theme, selectMode) {
    const jsonInfo = getItem();

    gridDraw(document.getElementById('sample'), jsonInfo.items, jsonInfo.fields, theme, selectMode);
  }

  document.addEventListener('DOMContentLoaded', function () {
    loadGrid(G_GRID_THEME, 'cell');
  });

  function getItem() {
    let items = GRID_EMPLOYEE_DATA;
    let fields = GRID_EMPLOYEE_FIELDS;

    return {
      items: items,
      fields: fields,
    };
  } //test

  let toolbarSelectionMode = 'cell';
  function gridDraw(element, items, fields, theme, selectMode) {
    gridObj = Daracl.grid.create(element, {
      //style: 'striped',
      selectionMode: selectMode, // row, cell, multiRow, multiCell, none// 선택 방법.
      hoverMode: 'none',
      enableWidthFixed: false,
      enableTooltip: true, // tooltip flag
      theme: theme,
      height: 480,
      aside: {
        lineNumber: { enabled: true },
        rowCheckbox: {
          enabled: true,
          width: 27,
          //, allowMultiSelect: false
        },
      },
      colOptions: {
        maxWidth: 1024,
      },
      valueFilter: function (colInfo, objValue) {
        return objValue[colInfo.key];
      },
      fields: fields,
      items: items,
      body: {
        row: {
          height: 60,
          selectRowOnCellClick: true,
        },
      },
      toolbar: {
        enabled: true,
        height: 40,
        defaultValues: {
          mode: toolbarSelectionMode,
        },
        items: [
          [
            {
              position: 'left',
              children: [
                {
                  label: '선택모드',
                  name: 'mode',
                  //width: 150,
                  gap: [10, 20],

                  renderer: {
                    type: 'choice',
                    listItem: {
                      multiple: false,
                      list: [
                        {
                          label: '셀(cell)',
                          value: 'cell',
                        },
                        {
                          label: '로우(row)',
                          value: 'row',
                        },
                        {
                          label: '다중 셀(multiCell)',
                          value: 'multiCell',
                        },
                        {
                          label: '다중 로우(multiRow)',
                          value: 'multiRow',
                        },
                        {
                          label: 'None(none)',
                          value: 'none',
                        },
                      ],
                    },
                  },

                  change: (info) => {
                    toolbarSelectionMode = info.value;
                    loadGrid(theme, info.value);
                  },
                },
              ],
            },
          ],
        ],
      },
    });
  }
</script>
