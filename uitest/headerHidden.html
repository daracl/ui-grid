<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <title>Dara header hidden</title>
</head>

<body>
  <div class="grid-view-area">
    <div id="sample" style="height: calc(100vh - 200px); width: 100%"></div>
  </div>
</body>

</html>
<script src="./data/sampleConfig.js" type="text/javascript"></script>
<script src="./data/employee.js" type="text/javascript"></script>
<script type="module" src="/src/index.ts"></script>

<script>
  var gridObj;

  function loadGrid(initFlag) {

    const jsonInfo = getItem();

    gridDraw(document.getElementById('sample'), jsonInfo.items, jsonInfo.fields);
  }

  document.addEventListener('DOMContentLoaded', function () {
    loadGrid(true);
  });

  function getItem() {
    let items = GRID_EMPLOYEE_DATA;
    let fields = [];

    fields = [
      {
        name: 'name',
        label: '이름',
        width: 80,
      },
      {
        name: 'age',
        label: '나이',
        width: 50,
      },
      {
        name: 'email',
        label: '이메일',
        width: 120,
      },
      {
        name: 'birth',
        label: '생년월일',
        width: 120,
        editRenderer: {
          type: 'date',
          /*
          , rule: {
            minimum: -100
            , maximum: 100
          }
            */
        },
      },
      {
        name: 'position',
        label: '직책',
        width: 80,
      },
      {
        name: 'salary',
        label: '월급',
        width: 80,
        displayFormat: {
          type: 'number',
          format: '₩ 0,0 원',
        },
        headerHelp(fieldInfo) {
          const field = fieldInfo.field;
          return field.label + ' // field 설정';
        },
      },
      {
        name: 'desc',
        label: '설명',
        width: 200,
      },
    ];

    return {
      items: items,
      fields: fields,
    };
  } //test

  function gridDraw(element, aaa, colItem) {
    gridObj = Daracl.grid.create(
      element,
      {
        editable: true,
        style: 'striped',
        selectionMode: 'multiCell', // row , cell , multiRow , multiCell	// 선택 방법.
        enableWidthFixed: false,
        enableTooltip: true, // tooltip flag
        theme: G_GRID_THEME,
        height: 335,
        aside: {
          lineNumber: { enabled: true },
        },
        colOptions: {
          maxWidth: 1024,
        },
        scroll: {
          enableWheelInContainer: true,
        },
        valueFilter: function (colInfo, objValue) {
          return objValue[colInfo.key];
        },
        fields: colItem,
        items: aaa,
        header: {
          view: false,
        },
      },
    );
  }
</script>
