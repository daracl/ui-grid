<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Dara move row</title>
  </head>

  <body>
    <div>
      theme
      <select id="theme">
        <option value="light" selected>light</option>
        <option value="dark">dark</option>
      </select>
    </div>

    <div class="grid-view-area">
      <div id="sample" style="height: calc(100vh - 200px); width: 100%"></div>
    </div>
  </body>
</html>
<script src="./data/employee.js" type="text/javascript"></script>
<script type="module" src="/src/index.ts"></script>

<script>
  var gridObj;
  const THEME_KEY = 'grid-theme';
  const theme = localStorage.getItem(THEME_KEY);

  if (theme) setMainTheme(theme);

  function setMainTheme(theme, persist = false) {
    const bodyElement = document.body;

    bodyElement.setAttribute('data-dg-theme', theme);

    if (gridObj) gridObj.setTheme(theme);

    if (persist) {
      localStorage.setItem(THEME_KEY, theme);
    }
  }

  function fn_button() {
    const themeElement = document.getElementById('theme');

    themeElement.addEventListener('change', (e) => {
      const value = themeElement.value;

      if (value) {
        setMainTheme(value, true);
      }
    });
  }

  function fn_init(initFlag) {
    const themeElement = document.getElementById('theme');

    if (themeElement) themeElement.value = theme ?? 'light';

    const jsonInfo = getItem();

    gridDraw(document.getElementById('sample'), jsonInfo.items, jsonInfo.fields);
  }

  document.addEventListener('DOMContentLoaded', function () {
    fn_button();
    fn_init(true);
  });

  function getItem() {
    let items = GRID_EMPLOYEE_DATA;
    let fields = [];

    fields = [
      {
        name: 'name',
        label: '이름',
        width: 80,
      },
      {
        name: 'age',
        label: '나이',
        width: 50,
        renderer: {
          type: 'number',
        },
      },
      {
        name: 'email',
        label: '이메일',
        width: 120,
      },
      {
        name: 'birth',
        label: '생년월일',
        align: 'center',
        width: 120,
        editRenderer: {
          type: 'date',
          /*
          , rule: {
            minimum: -100
            , maximum: 100
          }
            */
        },
      },
      {
        name: 'position',
        label: '직책',
        width: 80,
      },
      {
        name: 'salary',
        label: '월급',
        width: 80,
        displayFormat: {
          type: 'number',
          format: '₩ 0,0 원',
        },
      },
      {
        name: 'desc',
        label: '설명',
        width: 200,
      },
    ];

    return {
      items: items,
      fields: fields,
    };
  } //test

  function gridDraw(element, aaa, colItem, message) {
    gridObj = Daracl.grid.create(
      element,
      {
        editable: true,
        styleClass: 'striped',
        selectionMode: 'multiple-row', // row , cell , multiple-row , multiple-cell	// 선택 방법.
        enableWidthFixed: false,
        enableTooltip: true, // tooltip flag
        theme: document.getElementById('theme').value,
        height: 300,
        width: 1000,
        aside: {
          lineNumber: { enabled: true },
          rowCheckbox: {
            enabled: true,
            key: 'checkbox',
            width: 27,
            //, allowMultiSelect: false
          },
          modifyInfo: { enabled: true },
        },
        colOptions: {
          maxWidth: 1024,
        },
        scroll: {
          enableWheelInContainer: true,
        },
        valueFilter: function (colInfo, objValue) {
          return objValue[colInfo.key];
        },
        fields: colItem,
        items: aaa,
        body: {
          rowMove: {
            enabled: true,
            dragHandle: 'name',
            // drag 시작 콜백
            dragStart(itemInfo) {
              console.log('dragStart', itemInfo);
            },
            draggable(itemInfo) {
              console.log('draggable', itemInfo);
            }, // 기본 모든 row drag 가능
            // drag 중 위치 변경 콜백
            dragOver(dragInfo) {
              const { dropItemIdx, moveItems, position } = dragInfo;
              console.log('dragOver', position, dropItemIdx, moveItems);

              const moveIdx = dropItemIdx + (position == 'after' ? 1 : 0);
              if (moveIdx == 3) {
                return false; // drop 금지
              }
            },
            // drop 완료 콜백
            drop(itemInfo) {
              console.log('drop', itemInfo);
            },
            // drag 종료 콜백
            dragEnd(itemInfo) {
              console.log('dragEnd', itemInfo);
            },
            dragTemplate1(itemInfo) {
              const moveItem = itemInfo.moveItems[0];
              const info = moveItem.item;
              console.log(moveItem);
              return `${info.name} / ${info.age} / ${info.email} `;
            },
          },
        },

        contextMenu: {
          enableHeader: true,
          beforeActivate: function (info) {
            const field = info.field;
            const item = info.item;
            if (item) {
              gridObj.changeContextMenuHeader(item[field.name]);
            }
          },
          callback: function (item) {
            console.log(item.key, item);

            if (item.key == 'copy') {
              gridObj.copyData();
            }
          },
          items: [
            { key: 'refresh', label: '새로고침' },
            {
              divider: true,
            },
            {
              key: 'copy',
              label: '복사',
              hotkey: 'Ctrl+C',
              callback: function (item) {
                console.log('direct copy callback : ', item.key, item);

                if (item.key == 'copy') {
                  gridObj.copyData();
                }
              },
            },
            {
              key: 'sql_create',
              label: 'sql생성',
              disabled: true,
              children: [
                { key: 'selectStar', label: 'select *' },
                { key: 'select', label: 'select column' },
                { key: 'insert', label: 'insert' },
                { key: 'update', label: 'update' },
                { key: 'delete', label: 'delete' },
                { key: 'drop', label: 'drop' },
              ],
            },
            {
              key: 'download',
              label: 'download',
              children: [
                { checkbox: true, label: 'selet data', key: 'sqlGridResultSelect' },
                { divider: true },
                { key: 'download_excel', label: 'EXCEL' },
                { key: 'download_csv', label: 'CSV' },
                { key: 'download_xml', label: 'XML' },
                { key: 'download_json', label: 'json' },
              ],
            },
            {
              key: 'create_ddl',
              label: 'DDL 보기',
              hotkey: 'Ctrl+shift+C',
            },
            {
              key: 'mybatis-sql_create',
              label: 'mybatis Sql생성',
              children: [
                { key: 'mybatis_insert', label: 'insert', mode: 'insert', param_yn: 'Y' },
                { key: 'mybatis_update', label: 'update', mode: 'update', param_yn: 'Y' },
                { key: 'mybatis_delete', label: 'delete', mode: 'delete', param_yn: 'Y' },
              ],
            },
            {
              key: 'export',
              label: '내보내기',
              children: [
                { key: 'export_data', label: '데이타 내보내기' },
                { key: 'export_column', label: '컬럼정보 내보내기' },
              ],
            },
          ],
        },
      },
      message,
    );
  }
</script>
