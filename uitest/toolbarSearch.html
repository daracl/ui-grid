<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Dara toolbar search</title>
  </head>

  <body>
    <div>
      theme
      <select id="theme">
        <option value="light" selected>light</option>
        <option value="dark">dark</option>
      </select>
    </div>
    <div class="grid-view-area">
      <div id="sample" style="height: calc(100vh - 200px); width: 100%"></div>
    </div>
  </body>
</html>
<script src="./data/employee.js" type="text/javascript"></script>
<script type="module" src="/src/index.ts"></script>

<script>
  var gridObj;
  const THEME_KEY = 'grid-theme';
  const theme = localStorage.getItem(THEME_KEY);

  if (theme) setMainTheme(theme);

  function setMainTheme(theme, persist = false) {
    const bodyElement = document.body;

    bodyElement.setAttribute('data-dg-theme', theme);

    if (gridObj) gridObj.setTheme(theme);

    if (persist) {
      localStorage.setItem(THEME_KEY, theme);
    }
  }

  function fn_button() {
    const themeElement = document.getElementById('theme');

    themeElement.addEventListener('change', (e) => {
      const value = themeElement.value;

      if (value) {
        setMainTheme(value, true);
      }
    });
  }

  function fn_init(initFlag) {
    const themeElement = document.getElementById('theme');

    if (themeElement) themeElement.value = theme ?? 'light';

    const jsonInfo = getItem();

    gridDraw(document.getElementById('sample'), jsonInfo.items, jsonInfo.fields);
  }

  document.addEventListener('DOMContentLoaded', function () {
    fn_button();
    fn_init(true);
  });

  function getItem() {
    let items = GRID_EMPLOYEE_DATA;
    let fields = [];

    fields = [
      {
        name: 'name',
        label: '이름',
        align: 'center',
        width: 80,
      },
      {
        name: 'position',
        label: '직책',
        width: 150,
      },
      {
        name: 'age',
        label: '나이',
        align: 'center',
        width: 50,
      },
      {
        name: 'email',
        label: '이메일',
        width: 200,
      },
      {
        name: 'birth',
        label: '생년월일',
        width: 120,
        align: 'center',
        editRenderer: {
          type: 'date',
          /*
          , rule: {
            minimum: -100
            , maximum: 100
          }
            */
        },
      },

      {
        name: 'salary',
        label: '월급',
        width: 100,
        align: 'right',
        displayFormat: {
          type: 'number',
          format: '₩ 0,0 원',
        },
        headerHelp(fieldInfo) {
          const field = fieldInfo.field;
          return field.label + ' // field 설정';
        },
      },
      {
        name: 'desc',
        label: '설명',
        width: 200,
      },
    ];

    return {
      items: items,
      fields: fields,
    };
  } //test

  function gridDraw(element, aaa, colItem, message) {
    const searchFn = (info) => {
      const result = gridObj.search(info.values.searchValue);

      document.getElementById('searchData').innerHTML = result.matchIndex + '/' + result.count;
      // toolbar setValue 처리 할것.
    };

    gridObj = Daracl.grid.create(element, {
      editable: true,
      rowIdField: 'email',
      styleClass: 'striped',
      selectionMode: 'multiple-cell', // row , cell , multiple-row , multiple-cell	// 선택 방법.
      fixedLeftIndex: 2,
      enableWidthFixed: false,
      enableTooltip: true, // tooltip flag
      theme: document.getElementById('theme').value,
      height: 'auto',
      width: 'auto',

      toolbar: {
        enabled: true,
        height: 40,
        items: [
          [
            {
              position: 'left',
              children: [
                {
                  label: 'Theme',
                  name: 'theme',
                  width: 200,
                  renderer: {
                    type: 'dropdown',
                    listItem: {
                      list: [
                        { label: '다크', value: 'dark' },
                        { label: '라이트', value: 'light' },
                      ],
                    },
                  },

                  defaultValue: 'light',

                  change: (info) => {
                    console.log(info, info.value);

                    gridObj.setTheme(info.value);
                  },
                },
              ],
            },
          ],
          [
            {
              position: 'left',
              children: [
                {
                  renderer: {
                    type: 'html',
                  },

                  defaultValue() {
                    return '<span id="searchData">0/0</span>';
                  },
                },
              ],
            },
            {
              position: 'right',
              children: [
                {
                  name: 'searchValue',
                  renderer: 'search',
                  placeholder: '검색어',
                  width: 150,
                  search: searchFn,
                },
              ],
            },
          ],
        ],
      },
      fields: colItem,
      items: aaa,
      search: {
        enabled: true,
        hideNonMatched: true,
        enableColumnFix: true,
        click: false,
        mode: 'simple', //'full'
        width: 700,
        height: 250,
        onlyCloseButton: true,
        useRememberValue: true,
        callback: (data) => {
          //console.log(data)
        },
        rememberValue: { field: '$all', val: 'asdf' },
      },
    });
  }
</script>
