<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Dara header help</title>
  </head>

  <body>
    <div class="grid-view-area">
      <div id="sample" style="height: calc(100vh - 50px); width: 100%"></div>
    </div>
  </body>
</html>
<script src="./data/sampleConfig.js" type="text/javascript"></script>
<script src="./data/employee.js" type="text/javascript"></script>
<script type="module" src="/src/index.ts"></script>

<script>
  var gridObj;

  function loadGrid(initFlag) {
    const jsonInfo = getItem();

    gridDraw(document.getElementById('sample'), jsonInfo.items, jsonInfo.fields);
  }

  document.addEventListener('DOMContentLoaded', function () {
    loadGrid(true);
  });

  function getItem() {
    let items = GRID_EMPLOYEE_DATA;
    let fields = [
      {
        name: 'name',
        label: '이름',
        width: 80,
      },
      {
        name: 'age',
        label: '나이',
        width: 50,
      },
      {
        name: 'email',
        label: '이메일',
        width: 120,
      },
      {
        name: 'birth',
        label: '생년월일',
        width: 120,
        editRenderer: {
          type: 'date',
        },
      },
      {
        name: 'position',
        label: '직책',
        width: 80,
      },
      {
        name: 'salary',
        label: '월급',
        width: 80,
        displayFormat: {
          type: 'number',
          format: '₩ 0,0 원',
        },
        headerHelp(fieldInfo) {
          const field = fieldInfo.field;
          return field.label + ' // field 설정';
        },
      },
      {
        name: 'desc',
        label: '설명',
        width: 200,
      },
    ];

    return {
      items: items,
      fields: fields,
    };
  } //test

  function gridDraw(element, aaa, colItem) {
    gridObj = Daracl.grid.create(element, {
      editable: true,
      style: 'striped',
      selectionMode: 'multiCell', // row , cell , multiRow , multiCell	// 선택 방법.
      enableWidthFixed: false,
      enableTooltip: true, // tooltip flag
      theme: G_GRID_THEME,
      height: 335,
      width: 1000,
      aside: {
        lineNumber: { enabled: true },
      },
      colOptions: {
        maxWidth: 1024,
      },

      valueFilter: function (colInfo, objValue) {
        return objValue[colInfo.key];
      },
      fields: colItem,
      items: aaa,
      header: {
        view: true,
        enableViewAllLabel_1: true,
        //, heights: [20, 50, 50]
        sort: {
          //정렬 활성화 여부
          enabled: true,
          // null value 를 항상 끝으로 유지 할지 여부
          nullsLast: true,
          // custom sorting function
          //,customSorting: ()=>{console.log(arguments)}
        },
        //,height :30
        resize: {
          enabled: true,
          update: function (item) {
            //console.log(item);
          },
          minWidth: 10,
          maxWidth: 1000,
        },
        help: {
          enabled: true, // header help btn 활성 여부.
          content(fieldInfo) {
            const field = fieldInfo.field;
            return field.label;
          },
          click: (clickInfo) => {
            // click event
            console.log('clickInfo : ', clickInfo);
          },
        },
        drag: {
          enabled: true,
          dropSelector: '#dropTextArea',
          dropCallback: (data) => {},
        },
      },
    });
  }
</script>
