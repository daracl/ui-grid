<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Dara Scrollbar</title>
  </head>

  <body>
    <div class="grid-view-area">
      <div id="sample" style="height: calc(100vh - 50px); width: 100%; position: absolute"></div>
    </div>
  </body>
</html>

<script src="./data/sampleConfig.js" type="text/javascript"></script>
<script src="./data/employee.js" type="text/javascript"></script>
<script type="module" src="/src/index.ts"></script>

<style>
  .grid-view-area {
    position: relative;
  }
</style>
<script>
  var gridObj;
  // 스크롤 설정 정보
  var scrollOpts = {
    vertical: true,
    horizontal: true,
  };

  function loadGrid(initFlag) {
    const jsonInfo = getItem();

    gridDraw(document.getElementById('sample'), jsonInfo.items, jsonInfo.fields);
  }

  document.addEventListener('DOMContentLoaded', function () {
    loadGrid(true);
  });

  function getItem() {
    let items = GRID_EMPLOYEE_DATA;
    let fields = GRID_EMPLOYEE_FIELDS;

    return {
      items: items,
      fields: fields,
    };
  }

  function gridDraw(element, aaa, colItem, message) {
    gridObj = Daracl.grid.create(element, {
      search: {
        enabled: true,
        hideNonMatched: true,
        enableColumnFix: true,
        click: false,
        mode: 'simple', //'full'
        width: 700,
        height: 250,
        onlyCloseButton: true,
        useRememberValue: true,
        callback: (data) => {
          //console.log(data)
        },
        rememberValue: { field: '$all', val: 'asdf' },
      },
      fields: colItem,
      items: aaa,
      scroll: {
        vertical: {
          enable: scrollOpts.vertical,
        },
        horizontal: {
          enable: scrollOpts.horizontal,
        },
      },
      toolbar: {
        enabled: true,
        height: 40,
        defaultValues: {
          scroll: Object.entries(scrollOpts)
            .filter(([, value]) => value === false)
            .map(([key]) => key)
            .join(','),
        },
        items: [
          [
            {
              position: 'left',
              children: [
                {
                  label: '스크롤 비활성',
                  name: 'scroll',
                  gap: [10, 20],
                  width: 200,
                  renderer: {
                    type: 'choice',
                    listItem: {
                      list: [
                        { label: '세로', value: 'vertical' },
                        { label: '가로', value: 'horizontal' },
                      ],
                    },
                  },
                  change: (info) => {
                    console.log(info.value);

                    // scroll 설정
                    const values = info.value;
                    scrollOpts.vertical = !values.includes('vertical');
                    scrollOpts.horizontal = !values.includes('horizontal');

                    loadGrid();
                  },
                },
              ],
            },
          ],
        ],
      },
    });
  }
</script>
