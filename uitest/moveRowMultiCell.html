<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <title>Dara move row multiple cell</title>
</head>

<body>

  <div class="grid-view-area">
    <div id="sample" style="height: calc(100vh - 200px); width: 100%"></div>
  </div>
</body>

</html>
<script src="./data/sampleConfig.js" type="text/javascript"></script>
<script src="./data/employee.js" type="text/javascript"></script>
<script type="module" src="/src/index.ts"></script>

<style></style>

<script>
  var gridObj;


  function loadGrid(initFlag) {

    const jsonInfo = getItem();

    gridDraw(document.getElementById('sample'), jsonInfo.items, jsonInfo.fields);
  }

  document.addEventListener('DOMContentLoaded', function () {
    loadGrid(true);
  });

  function getItem() {
    let items = GRID_EMPLOYEE_DATA;
    let fields = [];

    fields = [
      {
        name: 'name',
        label: '이름',
        width: 80,
      },
      {
        name: 'age',
        label: '나이',
        width: 50,
      },
      {
        name: 'email',
        label: '이메일',
        width: 120,
      },
      {
        name: 'birth',
        label: '생년월일',
        width: 120,
        editRenderer: {
          type: 'date',
          /*
          , rule: {
            minimum: -100
            , maximum: 100
          }
            */
        },
      },
      {
        name: 'position',
        label: '직책',
        width: 80,
      },
      {
        name: 'salary',
        label: '월급',
        width: 80,
        displayFormat: {
          type: 'number',
          format: '₩ 0,0 원',
        },
      },
      {
        name: 'desc',
        label: '설명',
        width: 200,
      },
    ];

    return {
      items: items,
      fields: fields,
    };
  } //test

  function gridDraw(element, aaa, colItem, message) {
    gridObj = Daracl.grid.create(
      element,
      {
        editable: true,
        style: 'striped',
        selectionMode: 'multiCell', // row , cell , multiRow , multiCell	// 선택 방법.
        enableWidthFixed: false,
        enableTooltip: true, // tooltip flag
        theme: G_GRID_THEME,
        height: 335,
        width: 1000,
        aside: {
          lineNumber: { enabled: true },
          modifyInfo: { enabled: true },
        },
        colOptions: {
          maxWidth: 1024,
        },
        scroll: {
          enableWheelInContainer: true,
        },
        valueFilter: function (colInfo, objValue) {
          return objValue[colInfo.key];
        },
        fields: colItem,
        items: aaa,
        body: {
          rowMove: {
            enabled: true,
            dragHandle: 'email',
            // drag 시작 콜백
            dragStart(itemInfo) {
              console.log('dragStart', itemInfo);
            },
            draggable(itemInfo) {
              console.log('draggable', itemInfo);
            }, // 기본 모든 row drag 가능
            // drag 중 위치 변경 콜백
            dragOver(dragInfo) {
              const { dropItemIdx, moveItems, position } = dragInfo;
              console.log('dragOver', position, dropItemIdx, moveItems);

              const moveIdx = dropItemIdx + (position == 'after' ? 1 : 0);
              if (moveIdx == 3) {
                return false; // drop 금지
              }
            },
            // drop 완료 콜백
            drop(itemInfo) {
              console.log('drop', itemInfo);
            },
            // drag 종료 콜백
            dragEnd(itemInfo) {
              console.log('dragEnd', itemInfo);
            },
            dragTemplate(itemInfo) {
              const moveItems = itemInfo.moveItems;
              const moveItem = moveItems[0];
              const info = moveItem.item;
              console.log(moveItem);
              return `${moveItem.name} / ${moveItem.age} / ${moveItem.email} 외 ${moveItems.length - 1}건`;
            },
          },
        }
      },
    );
  }
</script>
