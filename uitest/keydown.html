<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Dara keydown</title>
  </head>

  <body>
    <div class="grid-view-area">
      <div id="sample" style="height: calc(100vh - 50px); width: 100%"></div>
    </div>
  </body>
</html>
<script src="./data/sampleConfig.js" type="text/javascript"></script>
<script src="./data/employee.js" type="text/javascript"></script>
<script type="module" src="/src/index.ts"></script>

<script>
  var gridObj;
  function loadGrid(initFlag) {
    const jsonInfo = getItem();

    gridDraw(document.getElementById('sample'), jsonInfo.items, jsonInfo.fields);
  }

  document.addEventListener('DOMContentLoaded', function () {
    loadGrid(true);
  });

  function getItem(type, itemCount, cellCount) {
    let items = GRID_EMPLOYEE_DATA;
    let fields = GRID_EMPLOYEE_FIELDS;

    return {
      items: items,
      fields: fields,
    };
  }

  function gridDraw(element, aaa, colItem, message) {
    gridObj = Daracl.grid.create(
      element,
      {
        style: 'striped',
        selectionMode: 'multiRow', // row , cell , multiRow , multiCell	// 선택 방법.
        fields: colItem,
        items: aaa,
        body: {
          //disableKeydown: true, // 키 이벤트 비활성화
          // 방향키 컨트롤 .
          keyNavHandler: function (moveInfo) {
            console.log(moveInfo);
          },
          pasteBefore: function (a) {
            console.log('pasteBefore', a);
            return a;
          },
          pasteAfter: function (a) {
            console.log('pasteAfter', a);
          },
        },
      },
      message,
    );
  }
</script>
