<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dara Grid - Simple PDF export</title>
    <style>
      body {
        margin: 24px;
        font-family: Arial, sans-serif;
      }

      #sample {
        width: 100%;
        height: 420px;
      }
    </style>
  </head>
  <body>
    <p><a href="./index.html">UI tests</a> | <a href="./pdf-export-group.html">Grouped</a> | <a href="./pdf-export-chart.html">Charts</a></p>
    <h1>Simple grid PDF export</h1>
    <p>Exports the visible columns and all rows in the current grid view.</p>
    <button id="export-pdf" type="button">Export PDF</button>
    <span id="export-status" role="status" aria-live="polite"></span>
    <div id="sample"></div>

    <script type="module">
      import { DaraGrid } from '/src/index.ts';

      const items = [
        { id: 1, name: 'Mina Kim', department: 'Engineering', salary: 5200000 },
        { id: 2, name: 'Joon Park', department: 'Design', salary: 4600000 },
        { id: 3, name: 'Sora Lee', department: 'Product', salary: 4900000 },
        { id: 4, name: 'Daniel Choi', department: 'Engineering', salary: 5800000 },
        { id: 5, name: 'Yuna Han', department: 'QA', salary: 4300000 },
        { id: 6, name: 'Alex Jung', department: 'Product', salary: 5100000 },
      ];

      const grid = DaraGrid.create(document.getElementById('sample'), {
        fields: [
          { name: 'id', label: 'ID', width: 80, align: 'right' },
          { name: 'name', label: 'Name', width: 180 },
          { name: 'department', label: 'Department', width: 180 },
          {
            name: 'salary',
            label: 'Salary',
            width: 160,
            align: 'right',
            displayFormat: { type: 'number', format: '₩ 0,0' },
          },
        ],
        items,
      });

      document.getElementById('export-pdf').addEventListener('click', async () => {
        const status = document.getElementById('export-status');
        status.textContent = ' Creating PDF...';
        try {
          await grid.exportPdf({
            fileName: 'simple-grid.pdf',
            title: 'Employee directory',
            author: 'Dara Grid UI test',
            orientation: 'landscape',
          });
          status.textContent = ' PDF downloaded.';
        } catch (error) {
          status.textContent = ` PDF export failed: ${error.message}`;
          console.error(error);
        }
      });
    </script>
  </body>
</html>
