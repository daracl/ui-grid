<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Dara tree</title>
  </head>

  <body>
    <div class="grid-view-area">
      <div id="sample" style="height: calc(100vh - 200px); width: 100%"></div>
    </div>
  </body>
</html>
<script src="./data/tree.js" type="text/javascript"></script>
<script type="module" src="/src/index.ts"></script>

<script>
  var gridObj;
  function fn_init(initFlag) {
    const jsonInfo = getItem();

    gridDraw(document.getElementById('sample'), jsonInfo.items, jsonInfo.fields);
  }

  document.addEventListener('DOMContentLoaded', function () {
    Daracl.grid.message({ 'no.data': '데이터가 없습니다.', 'select.all': 'ALL' });
    fn_init(true);
  });

  function getItem(type, itemCount, cellCount) {
    let items = G_TREE_CHILD_DATA;
    let fields = [];

    fields = [
      {
        name: 'id',
        label: 'ID',
        width: 80,
      },
      {
        name: 'name',
        label: '이름',
        width: 80,
        renderer: {
          type: 'tree',
        },
      },
      {
        name: 'position',
        label: '직책',
        width: 80,
      },
      {
        name: 'age',
        label: '나이',
        width: 50,
      },
      {
        name: 'email',
        label: '이메일',
        width: 120,
      },
    ];

    return {
      items: items,
      fields: fields,
    };
  } //test

  function gridDraw(element, aaa, colItem, message) {
    gridObj = Daracl.grid.create(
      element,
      {
        editable: false,
        //styleClass: 'striped',
        selectionMode: 'cell', // row , cell , multiple-row , multiple-cell	// 선택 방법.
        enableWidthFixed: false,
        enableTooltip: true, // tooltip flag
        fixedLeftIndex: 2,
        fixedRightIndex: 0,
        height: 300,

        tree: {
          expandDepth: 0,
          defaultExpandedIds: ['1-1'],
        },

        colOptions: {
          maxWidth: 1024,
        },
        valueFilter: function (colInfo, objValue) {
          return objValue[colInfo.key];
        },

        search: {
          enabled: true,
          enableColumnFix: true,
          click: false,
          mode: 'simple', //'full'
          width: 700,
          height: 250,
          onlyCloseButton: true,
          useRememberValue: true,
          callback: (data) => {
            //console.log(data)
          },
          rememberValue: { field: '$all', val: 'asdf' },
        },
        fields: colItem,
        items: aaa,
        body: {
          //disableKeydown: true, // 키벤트 비활성화
          // 방향키 컨트롤 .
          keyNavHandler: function (moveInfo) {
            //return false; //console.log(moveInfo);
          },
          pasteBefore: function (a) {
            console.log('pasteBefore', a);
            return a;
          },
          pasteAfter: function (a) {
            console.log('pasteAfter', a);
          },
          row: {
            height: 30,
            selectRowOnCellClick: true,
          },
        },
      },
      message,
    );
  }
</script>
