<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dara Grid - Group Row Span</title>
  <style>
    body {
      margin: 24px;
      font-family: Arial, sans-serif;
    }

    #sample {
      width: 100%;
      height: 420px;
    }
  </style>
</head>

<body>
  <h1>Group row span</h1>
  <p>100 detail rows | Merge consecutive equal values in partNo and partName without adding group header rows.</p>
  <div id="sample"></div>
  <script type="module">
    import { DaraGrid } from '/src/index.ts';

    const partNames = ['Bracket', 'Fastener', 'Panel', 'Cover', 'Connector'];
    const descriptions = ['Front', 'Rear', 'Left', 'Right', 'Center'];
    const items = Array.from({ length: 100 }, (_, index) => {
      const partIndex = Math.floor(index / 25);
      const nameIndex = Math.floor((index % 25) / 5);
      const descriptionIndex = index % descriptions.length;

      return {
        id: index + 1,
        partNo: `P-${100 + partIndex * 100}`,
        partName: partNames[nameIndex],
        description: `${descriptions[descriptionIndex]} ${partNames[nameIndex].toLowerCase()}`,
        quantity: ((index % 8) + 1) * (partIndex + 1),
      };
    });

    DaraGrid.create(document.getElementById('sample'), {
      rowSpanFields: ['partNo', 'partName'],
      selectionMode: 'multiCell',
      fields: [
        { name: 'partNo', label: 'Part No.', width: 160 },
        { name: 'partName', label: 'Part Name', width: 220 },
        { name: 'description', label: 'Description', width: 300 },
        { name: 'quantity', label: 'Quantity', width: 120, align: 'right' },
      ],
      items,
    });
  </script>
</body>

</html>
