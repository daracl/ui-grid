<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Dara Grid edit</title>
  </head>

  <body>
    <div>
      row
      <select id="itemCount">
        <option value="0">0</option>
        <option value="5">5</option>
        <option value="10">10</option>
        <option value="20">20</option>
        <option value="30">30</option>
        <option value="32">32</option>
        <option value="38">38</option>
        <option value="100" selected>100</option>
        <option value="500">500</option>
        <option value="1000">1,000</option>
        <option value="10000">10,000</option>
        <option value="100000">100,000</option>
        <option value="1000000">1,000,000</option>
      </select>

      cell
      <select id="cellCount">
        <option value="1">1</option>
        <option value="5">5</option>
        <option value="10">10</option>
        <option value="20" selected>20</option>
        <option value="25">25</option>
        <option value="50">50</option>
        <option value="100">100</option>
        <option value="300">300</option>
        <option value="500">500</option>
      </select>
      theme
      <select id="theme">
        <option value="light" selected>light</option>
        <option value="dark">dark</option>
      </select>

      타입
      <select id="dataType">
        <option value="1">헤더 2단</option>
        <option value="2" selected>헤더 3단</option>
        <option value="3">헤더 1단</option>
        <option value="4">직원</option>
      </select>
      <button type="button" onclick="fn_init()">regrid</button>
    </div>

    <div class="grid-view-area">
      <div id="sample" style="height: calc(100vh - 200px); width: 100%"></div>
    </div>
  </body>
</html>

<script src="./data/dropdown.js" type="text/javascript"></script>
<script src="./data/employee2.js" type="text/javascript"></script>
<script type="module" src="/src/index.ts"></script>

<style>
  .form-button {
    text-align: center;
  }

  :root {
    --bg: #ffffff;
    --bg-color: #070d19;
  }

  body[data-dg-theme='dark'] {
    --bg: #070d19;
    --bg-color: #ffffff;
  }

  body {
    background-color: var(--bg);
    color: var(--bg-color);
  }

  .header {
    color: var(--bg-color);
  }
</style>
<script>
  var gridObj;

  const foodMap = {
    ko: KOREAN_FOODS,
    en: AMERICAN_FOODS,
    zh: CHINESE_FOODS,
    jp: JAPANESE_FOODS,
  };

  function getRandomFoods(foodList, count = 2) {
    const shuffled = [...foodList].sort(() => 0.5 - Math.random());
    return shuffled.slice(0, count).map((f) => f.cd);
  }

  GRID_EMPLOYEE_DATA.forEach((emp) => {
    if (!emp.food) {
      const foods = foodMap[emp.country];

      if (foods) {
        emp.food = getRandomFoods(foods);
      } else {
        emp.food = [];
      }
    }
  });

  const THEME_KEY = 'grid-theme';
  const theme = localStorage.getItem(THEME_KEY);

  if (theme) setMainTheme(theme);

  function setMainTheme(theme, persist = false) {
    const bodyElement = document.body;

    if (gridObj) gridObj.setTheme(theme);

    bodyElement.setAttribute('data-dg-theme', theme);

    if (persist) {
      localStorage.setItem(THEME_KEY, theme);
    }
  }

  function fn_button() {
    const themeElement = document.getElementById('theme');

    themeElement.addEventListener('change', (e) => {
      const value = themeElement.value;

      if (value) {
        setMainTheme(value, true);
      }
    });
  }

  function fn_init(initFlag) {
    const themeElement = document.getElementById('theme');

    if (themeElement) themeElement.value = theme ?? 'light';

    if (initFlag) {
      const dgGridSampleConfig = localStorage.getItem('dgGridSampleConfig');

      if (dgGridSampleConfig) {
        try {
          const cfg = JSON.parse(dgGridSampleConfig);

          document.getElementById('dataType').value = cfg.itemType;
          document.getElementById('itemCount').value = cfg.itemCount;
          document.getElementById('cellCount').value = cfg.cellCount;
        } catch (e) {
          console.log('dgGridSampleConfig : ', dgGridSampleConfig, e);
        }
      }
    }

    const itemType = document.getElementById('dataType').value;
    const itemCount = parseInt(document.getElementById('itemCount').value, 10);
    const cellCount = parseInt(document.getElementById('cellCount').value, 10);

    localStorage.setItem('dgGridSampleConfig', JSON.stringify({ itemType, itemCount, cellCount }));

    const jsonInfo = getItem(itemType, itemCount, cellCount);

    gridDraw(document.getElementById('sample'), jsonInfo.items, jsonInfo.fields);
  }

  document.addEventListener('DOMContentLoaded', function () {
    Daracl.grid.message({ 'no.data': '데이터가 없습니다.', 'select.all': 'ALL' });
    fn_button();
    fn_init(true);
  });

  var itemIdx = 0;
  function getItem(type, itemCount, cellCount) {
    itemIdx++;
    let items = [];
    let fields = [];
    items = GRID_EMPLOYEE_DATA;

    fields = [
      {
        label: '사용자',
        children: [
          { name: 'username', label: '사용자명', width: 150, sort: true, editable: false },
          {
            name: 'email',
            label: '이메일',
            width: 100,
            styleClass: function (rowInfo) {
              const rowIdx = rowInfo.rowIdx;
              if (rowIdx % 3 === 0) return 'dg-primary';
              if (rowIdx % 3 === 1) return 'dg-success';
              return '';
            },
            editRenderer: {
              type: 'text',
              required: true,
              regexpType: 'email',
              rule: {
                minLength: 0,
                maxLength: 50,
              },
            },
          },
          {
            name: 'desc',
            label: '설명',
            width: 100,
            whiteSpace: 'wrap',
            editRenderer: {
              type: 'textarea',
            },
          },
        ],
      },
      {
        name: 's',
        label: 'sparklineBar',
        width: 100,
        headerTooltip: { enabled: false },
        renderer: {
          type: 'sparklineBar',
          refValue: (field, value) => ({ value }),
          click: function (item) {
            console.log('sparklineBar', item);
          },
        },
      },
      {
        name: 't',
        label: 'sparkline',
        width: 100,
        headerTooltip: {
          enabled: true,
          content: `sparkline : tooltip <br><span style="color:red;">경고</span>`,
        },
        renderer: {
          type: 'sparkline',
          refValue: (field, value) => ({ value }),
          click: function (item) {
            console.log('sparkline', item);
          },
        },
      },
      {
        name: 'homepageId',
        label: 'homepage',
        width: 60,
        editable: false,
        renderer: {
          type: 'link',
          refValue: (field, value) => ({ href: 'https://tool.daracl.com?v=' + value, label: value }),
          click1: function (cellInfo) {
            console.log(cellInfo);
            const field = cellInfo.field;
            const rowItem = cellInfo.item;
            alert('https://tool.daracl.com?v=' + rowItem[field.name]);
            return '';
          },
        },
      },
      {
        name: 'password',
        label: 'password',
        width: 100,
        renderer: {
          type: 'password',
        },
        editRenderer: {
          type: 'password',
        },
      },
      {
        name: 'amount',
        label: '금액',
        width: 80,
        align: 'right',
        renderer: {
          type: 'number',
        },
        editRenderer: {
          type: 'number',
          rule: {
            minimum: -100,
            maximum: 100,
          },
        },
      },
      {
        name: 'active',
        label: 'checkbox',
        width: 100,
        renderer: 'checkbox',
        editRenderer: {
          type: 'checkbox',
          trueValue: 'Y',
          falseValue: 'N',
          showLabel: true,
        },
      },
      {
        name: 'active',
        label: 'switch',
        width: 50,
        renderer: 'switch',
        editRenderer: {
          type: 'switch',
          trueValue: 'Y',
          falseValue: 'N',
        },
      },
      {
        name: 'country',
        label: '국가',
        width: 100,
        renderer: {
          type: 'dropdown',
        },
        editRenderer: {
          type: 'dropdown',
          listItem: {
            labelField: 'name',
            valueField: 'cd',
            list: [
              { name: 'KOREA', cd: 'ko' },
              { name: 'USA', cd: 'en' },
              { name: 'CHINA', cd: 'zh' },
              { name: 'JAPAN', cd: 'jp' },
            ],
          },
        },
      },
      {
        name: 'food',
        label: '음식',
        width: 100,
        type: 'text',
        renderer: {
          type: 'dropdown',
        },
        editRenderer: {
          type: 'dropdown',
          listItem: {
            labelField: 'name',
            valueField: 'cd',
            multiple: true,
            list: (cellInfo, callback) => {
              const item = cellInfo.item;

              if (typeof item === 'undefined') {
                callback(ALL_FOODS);
                return;
              }
              const dValue = item.country;

              let foods = [];

              if (dValue == 'en') {
                foods = AMERICAN_FOODS;
              } else if (dValue == 'zh') {
                foods = CHINESE_FOODS;
              } else if (dValue == 'jp') {
                foods = JAPANESE_FOODS;
              } else {
                foods = KOREAN_FOODS;
              }

              callback(foods);
            },
          },
        },
      },
      {
        name: 'profileHtml',
        label: 'html',
        width: 150,
        renderer: {
          type: 'html',
        },
        editRenderer: {
          type: 'textarea',
        },
      },
      {
        name: 'username',
        label: 'button',
        width: 100,
        renderer: {
          type: 'button',
          refValue: (field, value) => value,
          click: function (info) {
            console.log('button click', info);
          },
        },
      },
    ];

    //console.log(JSON.stringify(aaa));

    return {
      items: items,
      fields: fields,
    };
  } //test

  function gridDraw(element, aaa, colItem, message) {
    gridObj = Daracl.grid.create(element, {
      editable: true,
      styleClass: 'striped',
      selectionMode: 'multiple-cell', // row , cell , multiple-row , multiple-cell	// 선택 방법.
      enableTooltip: true, // tooltip flag
      theme: document.getElementById('theme').value,
      height: 480,
      aside: {
        lineNumber: { enabled: true },
        modifyInfo: { enabled: true },
      },
      colOptions: {
        maxWidth: 1024,
      },
      valueFilter: function (colInfo, objValue) {
        return objValue[colInfo.key];
      },
      header: {
        view: true,
        enableViewAllLabel: true,
        //, heights: [20, 50, 50]
        sort: {
          //정렬 활성화 여부
          enabled: false,
          // null value 를 항상 끝으로 유지 할지 여부
          nullsLast: true,
          // custom sorting function
          //,customSorting: ()=>{console.log(arguments)}
        },
        //,height :30
        resize: {
          enabled: true,
          update: function (item) {
            //console.log(item);
          },
          minWidth: 10,
          maxWidth: 1000,
        },
      },
      scroll: {
        enableWheelInContainer: true,
        horizontal: {
          enableWheel: true,
        },
      },
      fields: colItem,
      items: aaa,
      body: {
        row: {
          height: 50,
        },
      },
    });
  }

  function getRandomFloatFromInput(a, b) {
    const min = Math.min(a, b);
    const max = Math.max(a, b);
    return Math.floor(Math.random() * (max - min) + min);
  }

  function generateRandomNumbers(start, end, count) {
    if (start > end) {
      throw new Error('시작 값은 끝 값보다 작거나 같아야 합니다.');
    }
    if (count <= 0) {
      throw new Error('생성할 숫자의 개수는 1 이상이어야 합니다.');
    }

    const result = [];
    for (let i = 0; i < count; i++) {
      const random = Math.floor(Math.random() * (end - start + 1)) + start;
      result.push(random);
    }
    return result;
  }
</script>
