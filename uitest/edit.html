<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Dara Grid edit</title>
  </head>

  <body>
    <div class="grid-view-area">
      <div id="sample" style="height: calc(100vh - 50px); width: 100%"></div>
    </div>
  </body>
</html>

<script src="./data/sampleConfig.js" type="text/javascript"></script>
<script src="./data/dropdown.js" type="text/javascript"></script>
<script src="./data/employee2.js" type="text/javascript"></script>
<script type="module" src="/src/index.ts"></script>

<script>
  var gridObj;

  const foodMap = {
    ko: KOREAN_FOODS,
    en: AMERICAN_FOODS,
    zh: CHINESE_FOODS,
    jp: JAPANESE_FOODS,
  };

  function getRandomFoods(foodList, count = 2) {
    const shuffled = [...foodList].sort(() => 0.5 - Math.random());
    return shuffled.slice(0, count).map((f) => f.cd);
  }

  GRID_EMPLOYEE_DATA.forEach((emp) => {
    if (!emp.food) {
      const foods = foodMap[emp.country];

      if (foods) {
        emp.food = getRandomFoods(foods);
      } else {
        emp.food = [];
      }
    }
  });

  function loadGrid(initFlag) {
    const jsonInfo = getItem();

    gridDraw(document.getElementById('sample'), jsonInfo.items, jsonInfo.fields);
  }

  document.addEventListener('DOMContentLoaded', function () {
    loadGrid(true);
  });

  function getItem() {
    let items = [];
    let fields = [];
    items = GRID_EMPLOYEE_DATA;

    fields = [
      {
        label: '사용자',
        children: [
          { name: 'username', label: '사용자명', width: 150, sort: true, editable: false },
          {
            name: 'email',
            label: '이메일',
            width: 100,
            cellClassName: function (rowInfo) {
              const rowIdx = rowInfo.rowIdx;
              if (rowIdx % 3 === 0) return 'dg-primary';
              if (rowIdx % 3 === 1) return 'dg-success';
              return '';
            },
            editRenderer: {
              type: 'text',
              required: true,
              regexpType: 'email',
              rule: {
                minLength: 0,
                maxLength: 50,
              },
            },
          },
          {
            name: 'desc',
            label: '설명',
            width: 100,
            whiteSpace: 'wrap',
            editRenderer: {
              type: 'textarea',
            },
          },
        ],
      },
      {
        name: 's',
        label: 'sparklineBar',
        width: 100,
        headerTooltip: { enabled: false },
        renderer: {
          type: 'sparklineBar',
          refValue: (field, value) => ({ value }),
          click: function (item) {
            console.log('sparklineBar', item);
          },
        },
      },
      {
        name: 't',
        label: 'sparkline',
        width: 100,
        headerTooltip: {
          enabled: true,
          content: `sparkline : tooltip <br><span style="color:red;">경고</span>`,
        },
        renderer: {
          type: 'sparkline',
          refValue: (field, value) => ({ value }),
          click: function (item) {
            console.log('sparkline', item);
          },
        },
      },
      {
        name: 'homepageId',
        label: 'homepage',
        width: 60,
        editable: false,
        renderer: {
          type: 'link',
          refValue: (field, value) => ({ href: 'https://tool.daracl.com?v=' + value, label: value }),
          click1: function (cellInfo) {
            console.log(cellInfo);
            const field = cellInfo.field;
            const rowItem = cellInfo.item;
            alert('https://tool.daracl.com?v=' + rowItem[field.name]);
            return '';
          },
        },
      },
      {
        name: 'password',
        label: 'password',
        width: 100,
        renderer: {
          type: 'password',
        },
        editRenderer: {
          type: 'password',
        },
      },
      {
        name: 'amount',
        label: '금액',
        width: 80,
        align: 'right',
        renderer: {
          type: 'number',
        },
        editRenderer: {
          type: 'number',
          rule: {
            minimum: -100,
            maximum: 100,
          },
        },
      },
      {
        name: 'active',
        label: 'checkbox',
        width: 100,
        renderer: 'checkbox',
        editRenderer: {
          type: 'checkbox',
          trueValue: 'Y',
          falseValue: 'N',
          showLabel: true,
        },
      },
      {
        name: 'active',
        label: 'switch',
        width: 50,
        renderer: 'switch',
        editRenderer: {
          type: 'switch',
          trueValue: 'Y',
          falseValue: 'N',
        },
      },
      {
        name: 'country',
        label: '국가',
        width: 100,
        renderer: {
          type: 'dropdown',
        },
        editRenderer: {
          type: 'dropdown',
          required: true,
          listItem: {
            labelField: 'name',
            valueField: 'cd',
            list: [
              { name: 'KOREA', cd: 'ko' },
              { name: 'USA', cd: 'en' },
              { name: 'CHINA', cd: 'zh' },
              { name: 'JAPAN', cd: 'jp' },
            ],
          },
        },
      },
      {
        name: 'food',
        label: '음식',
        width: 100,
        type: 'text',
        renderer: {
          type: 'dropdown',
        },
        editRenderer: {
          type: 'dropdown',
          listItem: {
            labelField: 'name',
            valueField: 'cd',
            multiple: true,
            list: (cellInfo, callback) => {
              const item = cellInfo.item;

              if (typeof item === 'undefined') {
                callback(ALL_FOODS);
                return;
              }
              const dValue = item.country;

              let foods = [];

              if (dValue == 'en') {
                foods = AMERICAN_FOODS;
              } else if (dValue == 'zh') {
                foods = CHINESE_FOODS;
              } else if (dValue == 'jp') {
                foods = JAPANESE_FOODS;
              } else {
                foods = KOREAN_FOODS;
              }

              callback(foods);
            },
          },
        },
      },
      {
        name: 'profileHtml',
        label: 'html',
        width: 150,
        renderer: {
          type: 'html',
        },
        editRenderer: {
          type: 'textarea',
        },
      },
      {
        name: 'username',
        label: 'button',
        width: 100,
        renderer: {
          type: 'button',
          refValue: (field, value) => value,
          click: function (info) {
            console.log('button click', info);
          },
        },
      },
    ];

    return {
      items: items,
      fields: fields,
    };
  }

  function gridDraw(element, aaa, colItem, message) {
    gridObj = Daracl.grid.create(element, {
      editable: true,
      style: 'striped',
      deleteMode: 'soft',
      selectionMode: 'multiCell', // row , cell , multiRow , multiCell	// 선택 방법.
      enableTooltip: true, // tooltip flag
      theme: G_GRID_THEME,
      height: 480,
      aside: {
        lineNumber: { enabled: true },
        rowCheckbox: {
          enabled: true,
          width: 27,
        },
        modifyInfo: { enabled: true },
      },
      scroll: {
        horizontal: {
          enableWheel: true,
        },
      },
      fields: colItem,
      items: aaa,
      body: {
        row: {
          height: 50,
        },
      },
      toolbar: {
        enabled: true,
        height: 40,
        items: [
          [
            {
              position: 'left',
              children: [
                {
                  renderer: { type: 'button', icon: 'add' },
                  label: '행 추가',
                  click(info) {
                    gridObj.createItem({});
                  },
                },
                {
                  renderer: { type: 'button', icon: 'delete' },
                  label: '선택 행 삭제',
                  click(info) {
                    gridObj.removeItems(gridObj.getSelectedRowIds());
                  },
                },
                {
                  renderer: { type: 'button', icon: 'delete' },
                  label: '체크된 행 삭제',
                  click(info) {
                    gridObj.removeItems(gridObj.getCheckedIds());
                  },
                },
              ],
            },
          ],
        ],
      },
    });
  }
</script>
