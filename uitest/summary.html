<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Dara summary</title>
  </head>

  <body>
    <div class="grid-view-area">
      <div id="sample" style="height: calc(100vh - 200px); width: 100%"></div>
    </div>
  </body>
</html>

<script src="./data/sampleConfig.js" type="text/javascript"></script>
<script src="./data/employee.js" type="text/javascript"></script>
<script type="module" src="/src/index.ts"></script>

<style>
  .salary-5 {
    background-color: #f30606 !important;
  }

  .salary-10 {
    background-color: #e48140 !important;
  }

  .salary-15 {
    background-color: #b6cc65 !important;
  }

  .salary-up {
    background-color: #4df398 !important;
  }
</style>
<script>
  var gridObj;

  function fn_init(initFlag) {
    const jsonInfo = getItem(4, 100, 20);

    gridDraw(document.getElementById('sample'), jsonInfo.items, jsonInfo.fields);
  }

  document.addEventListener('DOMContentLoaded', function () {
    fn_init(true);
  });

  var itemIdx = 0;
  function getItem(type, itemCount, cellCount) {
    itemIdx++;
    let items = [];
    let fields = [];

    const orginItemCount = itemCount;

    itemCount = orginItemCount == 0 ? 1 : itemCount;

    items = GRID_EMPLOYEE_DATA;
    fields = [
      {
        name: 'name',
        label: '이름',
        width: 80,
        align: 'center',
      },
      {
        name: 'age',
        label: '나이',
        width: 50,
        renderer: { type: 'number' },
      },
      {
        name: 'email',
        label: '이메일',
        width: 120,
      },
      {
        name: 'birth',
        label: '생년월일',
        width: 120,
        editRenderer: {
          type: 'date',
          /*
        , rule: {
          minimum: -100
          , maximum: 100
        }
          */
        },
      },
      {
        name: 'position',
        label: '직책',
        width: 80,
      },
      {
        name: 'salary',
        label: '월급',
        width: 100,
        renderer: { type: 'number' },
        displayFormat: {
          type: 'number',
          format: '₩ 0,0 원',
        },
      },
      {
        name: 'desc',
        label: '설명',
        width: 200,
        whiteSpace: 'wrap',
      },
    ];

    items = orginItemCount == 0 ? [] : items;

    return {
      items: items,
      fields: fields,
    };
  } //test

  function gridDraw(element, aaa, colItem) {
    gridObj = Daracl.grid.create(element, {
      editable: true,
      style: 'striped',
      selectionMode: 'multiCell', // row , cell , multiRow , multiCell	// 선택 방법.
      enableWidthFixed: false,
      enableTooltip: true, // tooltip flag
      theme: G_GRID_THEME,
      height: 480,
      aside: {
        lineNumber: { enabled: true },
      },
      colOptions: {
        maxWidth: 1024,
      },
      valueFilter: function (colInfo, objValue) {
        return objValue[colInfo.key];
      },
      header: {
        view: true,
        enableViewAllLabel_1: true,
        //, heights: [20, 50, 50]
        sort: {
          //정렬 활성화 여부
          enabled: true,
          // null value 를 항상 끝으로 유지 할지 여부
          nullsLast: true,
          // custom sorting function
          //,customSorting: ()=>{console.log(arguments)}
        },
        //,height :30
        resize: {
          enabled: true,
          update: function (item) {
            //console.log(item);
          },
          minWidth: 10,
          maxWidth: 1000,
        },
        help: {
          enabled: true, // header help btn 활성 여부.
          tootip: (field) => {
            return 'test';
          },
          click: (clickInfo) => {
            // click event
            console.log('clickInfo : ', clickInfo);
          },
        },
        drag: {
          enabled: true,
          dropSelector: '#dropTextArea',
          dropCallback: (data) => {},
        },
      },
      summary: {
        position: 'top',
        height: [30, 40],
        items: [
          [
            { name: 'name', label: '합계\n합계\n합계', whiteSpace: 'pre' },
            { name: 'age', expression: 'sum' },
            {
              name: 'birth',
              rowspan: 2,
              colspan: 2,

              expression: 'count',
            },
            {
              name: 'salary',
              colspan: 2,
              align: 'center',
              cellClassName: function (val) {
                if (val < 5000000) {
                  return 'salary-5';
                } else if (val < 10000000) {
                  return 'salary-10';
                } else if (val < 15000000) {
                  return 'salary-15';
                } else if (val > 15000000) {
                  return 'salary-up';
                }
                return '';
              },
              expression: 'sum',
              displayFormat: {
                type: 'number',
                format: '₩ 0,0 원',
              },
            },
          ],
          [
            { name: 'name', label: '평균' },
            {
              name: 'age',
              expression: 'average',
              displayFormat: {
                type: 'number',
                format: '0,0.00',
              },
            },
            {
              name: 'salary',
              expression: 'average',
              displayFormat: {
                type: 'number',
                format: '0,0',
              },
            },
          ],
        ],
      },
      scroll: {
        enableWheelInContainer: true,
        vertical: {
          enable1: false,
          onUpdate: function (item) {
            // 스크롤 업데이트.
            //console.log(item);
            //return true;
          },
        },
        horizontal: {
          enableWheel: true,
        },
      },

      fields: colItem,
      items: aaa,
      body: {
        cellDblClick: function (itemInfo) {
          //console.log('cellDblClick', itemInfo)
        },
        cellClick: function (itemInfo) {
          //console.log('cellClick', itemInfo)
        },
        // 방향키 컨트롤 .
        keyNavHandler: function (moveInfo) {
          //console.log(moveInfo);
        },
        pasteBefore: function (a) {
          console.log('pasteBefore', a);
          return a;
        },
        pasteAfter: function (a) {
          console.log('pasteAfter', a);
        },
        row: {
          height: 60,
          selectRowOnCellClick: true,
        },
      },
    });
  }
</script>
