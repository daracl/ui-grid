<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Dara toolbar</title>
  </head>

  <body>
    <div>Toolbar 를 마우스 휠로 이동 가능함.</div>
    <div class="grid-view-area" style="display: flex; align-items: center; justify-content: center">
      <div id="sample" style="height: calc(100vh - 50px); width: 80%"></div>
    </div>
  </body>
</html>

<script src="./data/sampleConfig.js" type="text/javascript"></script>
<script src="./data/employee.js" type="text/javascript"></script>
<script type="module" src="/src/index.ts"></script>

<script>
  var gridObj;

  function loadGrid(initFlag) {
    const jsonInfo = getItem();

    gridDraw(document.getElementById('sample'), jsonInfo.items, jsonInfo.fields);
  }

  document.addEventListener('DOMContentLoaded', function () {
    loadGrid(true);
  });

  function getItem() {
    let items = GRID_EMPLOYEE_DATA;
    let fields = GRID_EMPLOYEE_FIELDS;

    return {
      items: items,
      fields: fields,
    };
  }

  function gridDraw(element, aaa, colItem, message) {
    gridObj = Daracl.grid.create(element, {
      editable: true,
      rowIdField: 'email',
      style: 'striped',
      selectionMode: 'multiCell', // row , cell , multiRow , multiCell	// 선택 방법.
      fixedLeftIndex: 2,
      enableWidthFixed: false,
      enableTooltip: true, // tooltip flag
      theme: G_GRID_THEME,
      height: 'auto',
      width: 'auto',
      toolbar: {
        enabled: true,
        arrowEnabled: true,
        defaultValues: {
          mode: 'N',
          choice: '대리',
          choice1: '대리',
          theme: 'dark',
          dropdown: '대리',
          step: '설계',
        },
        items: [
          [
            {
              position: 'left',
              children: [
                {
                  label: 'Theme',
                  name: 'theme',
                  width: 200,
                  renderer: {
                    type: 'dropdown',
                    required: true,
                    listItem: {
                      list: [
                        { label: '다크', value: 'dark' },
                        { label: '라이트', value: 'light' },
                      ],
                    },
                  },
                  change: (info) => {
                    gridObj.setTheme(info.value);
                  },
                },
                {
                  label: 'Category',
                  name: 'dropdown',
                  width: 150,
                  renderer: {
                    type: 'dropdown',
                    listItem: {
                      includeAllOption: true,
                      multiple: true,
                      list: ['대리', '과장', '부장'],
                    },
                  },
                  change: (info) => {},
                },
                {
                  label: '단계',
                  name: 'step',
                  width: 150,
                  renderer: {
                    type: 'dropdown',
                    listItem: {
                      multiple: true,
                      list: ['설계', '개발', '운영'],
                    },
                  },
                  change: (info) => {},
                },
              ],
            },

            {
              position: 'right',
              children: [
                {
                  name: 'search',
                  width: 200,
                  renderer: 'search',
                  label: '검색',
                  search(info) {
                    console.log(info);
                  },
                },
              ],
            },
          ],
          [
            {
              position: 'left',
              children: [
                {
                  label: '숫자',
                  name: 'number',
                  width: 200,
                  renderer: 'number',
                },
                {
                  label: '달력',
                  name: 'date',
                  width: 200,
                  renderer: 'date',
                },
                {
                  label: '사용여부',
                  name: 'switch',
                  width: 90,
                  gap: [10, 20],
                  defaultValue: true,
                  renderer: {
                    type: 'switch',
                  },

                  change: (info) => {
                    console.log(info, info.value);
                  },
                },
                {
                  label: 'on/off',
                  name: 'switchonoff',
                  width: 90,
                  gap: [10, 20],
                  defaultValue: 'ON',
                  renderer: {
                    type: 'switch',
                    variant: 'box',
                    trueValue: 'ON',
                    falseValue: 'OFF',
                    showLabel: true,
                  },

                  change: (info) => {
                    console.log(info, info.value);
                  },
                },

                {
                  width: 100,
                  defaultValue() {
                    return '<div style="border:1px solid #dddddd;" onclick="alert(1)">test</div>';
                  },
                  renderer: 'html',
                },
              ],
            },
          ],
          [
            {
              position: 'left',
              children: [
                {
                  label: '체크',
                  name: 'choice',
                  //width: 150,
                  gap: [10, 20],
                  renderer: {
                    type: 'choice',

                    listItem: {
                      labelOnly: false,
                      list: ['대리', '과장', '부장'],
                    },
                  },

                  change: (info) => {
                    console.log(info, info.value);
                  },
                },

                {
                  label: '라디오 초이스',
                  name: 'choice1',
                  //width: 150,
                  gap: [10, 20],

                  renderer: {
                    type: 'choice',
                    listItem: {
                      multiple: false,
                      labelOnly: false,
                      list: ['대리', '과장', '부장'],
                    },
                  },

                  change: (info) => {
                    console.log(info, info.value);
                  },
                },
              ],
            },
          ],
          [
            {
              position: 'left',
              children: [
                {
                  renderer: 'hidden',
                  name: 'mode',
                },
                {
                  renderer: { type: 'button', icon: 'add' },
                  label: '추가',
                  click(info) {
                    console.log('추가 클릭');
                    gridObj.setToolbarValues({ mode: 'N' });
                  },
                  condition: {
                    visible(toolbarInfo) {
                      console.log('visible ', toolbarInfo);
                      const field = toolbarInfo.field;
                      const values = toolbarInfo.values;
                      return values['theme'] == 'light';
                    },
                  },
                },
                {
                  renderer: { type: 'button', icon: 'edit' },
                  rendererClassName: 'dg-primary',
                  label: '편집',
                  click(info) {
                    console.log(info);
                  },
                  condition: {
                    disabled(toolbarInfo) {
                      const field = toolbarInfo.field;
                      const values = toolbarInfo.values;

                      return values['theme'] == 'light';
                    },
                  },
                },
                {
                  renderer: { type: 'button', icon: 'mapping' },
                  rendererClassName: 'dg-secondary',
                  label: '맵핑',
                  click(info) {
                    console.log(info);
                  },
                },
                {
                  renderer: { type: 'button', icon: 'preview' },
                  rendererClassName: 'dg-info',
                  label: '미리보기',
                  click(info) {
                    console.log(info);
                  },
                },
                {
                  renderer: { type: 'button', icon: 'permission' },
                  rendererClassName: 'dg-success',
                  label: '권한',

                  click(info) {
                    console.log(info);
                  },
                },
                {
                  renderer: { type: 'button', icon: 'parameter' },
                  rendererClassName: 'dg-warning',
                  label: 'parameter',
                  click(info) {
                    console.log(info);
                  },
                },
                {
                  renderer: { type: 'button', icon: 'start' },
                  rendererClassName: 'dg-danger',
                  label: 'Start',
                  click(info) {
                    console.log(info);
                  },
                },
                {
                  renderer: { type: 'button', icon: 'stop' },
                  label: 'Stop',
                  click(info) {
                    console.log(info);
                  },
                },
                {
                  renderer: { type: 'button', icon: 'pause' },
                  label: 'Pause',
                  click(info) {
                    console.log(info);
                  },
                },

                {
                  renderer: { type: 'button', icon: 'restart' },
                  label: 'Restart',
                  click(info) {
                    console.log(info);
                  },
                },
                {
                  renderer: { type: 'button', icon: 'terminate' },
                  label: 'Terminate',
                  click(info) {
                    console.log(info);
                  },
                },

                {
                  renderer: { type: 'button', icon: 'delete' },
                  label: '삭제',
                  click(info) {
                    console.log(info);
                  },
                },
                {
                  renderer: { type: 'button', icon: 'save' },
                  label: '저장',
                  click(info) {
                    console.log(info);
                  },
                },
                {
                  renderer: { type: 'button', icon: 'copy' },
                  label: '복사',
                  click(info) {
                    console.log(info);
                  },
                },
                {
                  renderer: { type: 'button', icon: 'move' },
                  label: '이동',
                  click(info) {
                    console.log(info);
                  },
                },
                {
                  renderer: { type: 'button', icon: 'upload' },
                  label: '업로드',
                  click(info) {
                    console.log(info);
                  },
                },
                {
                  renderer: { type: 'button', icon: 'download' },
                  label: '다운로드',
                  click(info) {
                    console.log(info);
                  },
                },
                {
                  renderer: { type: 'button', icon: 'refresh' },
                  label: '새로고침',
                  click(info) {
                    console.log(info);
                  },
                },
                {
                  renderer: { type: 'button', icon: 'search' },
                  //label: '검색',
                  click(info) {
                    console.log(info);
                  },
                },
                {
                  renderer: { type: 'button', icon: 'cut' },
                  //label: '잘라내기',
                  click(info) {
                    console.log(info);
                  },
                },

                ,
              ],
            },
          ],
        ],
      },
      fields: colItem,
      items: aaa,
    });
  }
</script>
