<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Dara toolbar</title>
  </head>

  <body>
    <div>
      theme
      <select id="theme">
        <option value="light" selected>light</option>
        <option value="dark">dark</option>
      </select>
    </div>
    <div class="grid-view-area">
      <div id="sample" style="height: calc(100vh - 200px); width: 100%"></div>
    </div>
  </body>
</html>
<script src="./data/employee.js" type="text/javascript"></script>
<script type="module" src="/src/index.ts"></script>

<script>
  var gridObj;
  const THEME_KEY = 'grid-theme';
  const theme = localStorage.getItem(THEME_KEY);

  if (theme) setMainTheme(theme);

  function setMainTheme(theme, persist = false) {
    const bodyElement = document.body;

    bodyElement.setAttribute('data-dg-theme', theme);

    if (gridObj) gridObj.setTheme(theme);

    if (persist) {
      localStorage.setItem(THEME_KEY, theme);
    }
  }

  function fn_button() {
    const themeElement = document.getElementById('theme');

    themeElement.addEventListener('change', (e) => {
      const value = themeElement.value;

      if (value) {
        setMainTheme(value, true);
      }
    });
  }

  function fn_init(initFlag) {
    const themeElement = document.getElementById('theme');

    if (themeElement) themeElement.value = theme ?? 'light';

    const jsonInfo = getItem();

    gridDraw(document.getElementById('sample'), jsonInfo.items, jsonInfo.fields);
  }

  document.addEventListener('DOMContentLoaded', function () {
    fn_button();
    fn_init(true);
  });

  function getItem() {
    let items = GRID_EMPLOYEE_DATA;
    let fields = [];

    fields = [
      {
        name: 'name',
        label: '이름',
        align: 'center',
        width: 80,
      },
      {
        name: 'position',
        label: '직책',
        width: 150,
      },
      {
        name: 'age',
        label: '나이',
        align: 'center',
        width: 50,
      },
      {
        name: 'email',
        label: '이메일',
        width: 200,
      },
      {
        name: 'birth',
        label: '생년월일',
        width: 120,
        align: 'center',
        editRenderer: {
          type: 'date',
          /*
          , rule: {
            minimum: -100
            , maximum: 100
          }
            */
        },
      },

      {
        name: 'salary',
        label: '월급',
        width: 100,
        align: 'right',
        displayFormat: {
          type: 'number',
          format: '₩ 0,0 원',
        },
        headerHelp(fieldInfo) {
          const field = fieldInfo.field;
          return field.label + ' // field 설정';
        },
      },
      {
        name: 'desc',
        label: '설명',
        width: 200,
      },
    ];

    return {
      items: items,
      fields: fields,
    };
  } //test

  function gridDraw(element, aaa, colItem, message) {
    gridObj = Daracl.grid.create(element, {
      editable: true,
      rowIdField: 'email',
      styleClass: 'striped',
      selectionMode: 'multiple-cell', // row , cell , multiple-row , multiple-cell	// 선택 방법.
      fixedLeftIndex: 2,
      enableWidthFixed: false,
      enableTooltip: true, // tooltip flag
      theme: document.getElementById('theme').value,
      height: 335,
      width: 'auto',

      toolbar: {
        enabled: true,
        height: 30,
        items: [
          [
            {
              position: 'left',
              //width: 500,
              children: [
                {
                  label: '검색조건',
                  name: 'searchField',
                  renderer: 'dropdown',
                  width: 150,
                  gap: 10,
                },
                {
                  label: '검색조건1',
                  name: 'searchValue',
                  renderer: 'text',
                  width: 150,
                },
                { name: 'searchValue2', renderer: 'text' },
                { name: 'searchValue3', renderer: 'text' },
              ],
            },
            {
              position: 'center',
              width: 300,
              children: [
                {
                  name: 'centerValue',
                  label: '가운데',
                  renderer: 'text',
                  width: 120,
                },
                {
                  name: 'centerValue2',
                  label: '가운데2',
                  renderer: 'text',
                  width: 120,
                },
              ],
            },
            {
              position: 'right',
              children: [
                { name: 'searchBtn', renderer: 'button', label: '검색' },
                { name: 'initBtn', renderer: 'button', label: '초기화' },
              ],
            },
          ],
          [
            {
              position: 'center',
              width: 500,
              children: [
                {
                  label: '가운데 정렬',
                  name: 'searchField',
                  width: 200,
                  renderer: 'dropdown',
                },
                { label: '검색어', name: 'searchValue', renderer: 'text' },
                {
                  name: 'searchBtn',
                  renderer: 'button',
                  width: 'auto',
                  label: '검색검색검색검색',
                },
              ],
            },
          ],
        ],
      },
      fields: colItem,
      items: aaa,
    });
  }
</script>
