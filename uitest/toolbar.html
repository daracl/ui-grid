<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Dara toolbar</title>
  </head>

  <body>
    <div>
      theme
      <select id="theme">
        <option value="light" selected>light</option>
        <option value="dark">dark</option>
      </select>
    </div>
    <div class="grid-view-area">
      <div id="sample" style="height: calc(100vh - 200px); width: 100%"></div>
    </div>
  </body>
</html>
<script src="./data/employee.js" type="text/javascript"></script>
<script type="module" src="/src/index.ts"></script>

<script>
  var gridObj;
  const THEME_KEY = 'grid-theme';
  const theme = localStorage.getItem(THEME_KEY);

  if (theme) setMainTheme(theme);

  function setMainTheme(theme, persist = false) {
    const bodyElement = document.body;

    bodyElement.setAttribute('data-dg-theme', theme);

    if (gridObj) gridObj.setTheme(theme);

    if (persist) {
      localStorage.setItem(THEME_KEY, theme);
    }
  }

  function fn_init(initFlag) {
    const themeElement = document.getElementById('theme');

    if (themeElement) themeElement.value = theme ?? 'light';

    const jsonInfo = getItem();

    gridDraw(document.getElementById('sample'), jsonInfo.items, jsonInfo.fields);
  }

  document.addEventListener('DOMContentLoaded', function () {
    fn_init(true);
  });

  function getItem() {
    let items = GRID_EMPLOYEE_DATA;
    let fields = [];

    fields = [
      {
        name: 'name',
        label: '이름',
        align: 'center',
        width: 80,
      },
      {
        name: 'position',
        label: '직책',
        width: 150,
      },
      {
        name: 'age',
        label: '나이',
        align: 'center',
        width: 50,
      },
      {
        name: 'email',
        label: '이메일',
        width: 200,
      },
      {
        name: 'birth',
        label: '생년월일',
        width: 120,
        align: 'center',
        editRenderer: {
          type: 'date',
          /*
          , rule: {
            minimum: -100
            , maximum: 100
          }
            */
        },
      },

      {
        name: 'salary',
        label: '월급',
        width: 100,
        align: 'right',
        displayFormat: {
          type: 'number',
          format: '₩ 0,0 원',
        },
        headerHelp(fieldInfo) {
          const field = fieldInfo.field;
          return field.label + ' // field 설정';
        },
      },
      {
        name: 'desc',
        label: '설명',
        width: 200,
      },
    ];

    return {
      items: items,
      fields: fields,
    };
  } //test

  function gridDraw(element, aaa, colItem, message) {
    gridObj = Daracl.grid.create(element, {
      editable: true,
      rowIdField: 'email',
      styleClass: 'striped',
      selectionMode: 'multiple-cell', // row , cell , multiple-row , multiple-cell	// 선택 방법.
      fixedLeftIndex: 2,
      enableWidthFixed: false,
      enableTooltip: true, // tooltip flag
      theme: document.getElementById('theme').value,
      height: 'auto',
      width: 'auto',

      toolbar: {
        enabled: true,
        height: 40,
        items: [
          [
            {
              position: 'left',
              children: [
                {
                  label: 'Theme',
                  name: 'theme',
                  width: 200,
                  renderer: {
                    type: 'dropdown',
                    required: true,
                    listItem: {
                      list: [
                        { label: '다크', value: 'dark' },
                        { label: '라이트', value: 'light' },
                      ],
                    },
                  },

                  defaultValue: 'light',

                  change: (info) => {
                    console.log(info);
                    gridObj.setTheme(info.value);
                  },
                },
                {
                  label: 'Category',
                  name: 'dropdown',
                  width: 150,
                  renderer: {
                    type: 'dropdown',
                    listItem: {
                      includeAllOption: true,
                      multiple: true,
                      list: ['대리', '과장', '부장'],
                    },
                  },
                  defaultValue: '대리',
                  change: (info) => {},
                },
                {
                  label: '단계',
                  name: 'step',
                  width: 150,
                  renderer: {
                    type: 'dropdown',
                    listItem: {
                      multiple: true,
                      list: ['설계', '개발', '운영'],
                    },
                  },
                  defaultValue: '설계',
                  change: (info) => {},
                },
              ],
            },

            {
              position: 'right',
              children: [
                {
                  name: 'searchValue',
                  renderer: {
                    type: 'text',
                  },
                  placeholder: '검색어',
                  width: 150,
                  change: (info) => {
                    console.log(info, info.value);
                  },
                },
                {
                  name: 'search',
                  width: 200,
                  renderer: 'search',
                  label: '검색',
                  search(info) {
                    console.log(info);
                  },
                },
              ],
            },
          ],
          [
            {
              position: 'left',
              children: [
                {
                  label: '숫자',
                  name: 'number',
                  width: 200,
                  renderer: 'number',
                },
                {
                  label: '달력',
                  name: 'date',
                  width: 200,
                  renderer: 'date',
                },
                {
                  label: '사용여부',
                  name: 'switch',
                  width: 150,
                  gap: [10, 20],
                  defaultValue: 'Y',
                  styleClass: 'asdf',
                  renderer: {
                    type: 'switch',
                    trueValue: 'Y',
                    falseValue: 'N',
                  },

                  change: (info) => {
                    console.log(info, info.value);
                  },
                },
                {
                  width: 100,
                  defaultValue() {
                    return '<div style="border:1px solid #dddddd;" onclick="alert(1)">test</div>';
                  },
                  renderer: 'html',
                },
              ],
            },
          ],
          [
            {
              position: 'left',
              children: [
                {
                  label: '체크',
                  name: 'choice',
                  //width: 150,
                  gap: [10, 20],
                  defaultValue: '대리',
                  renderer: {
                    type: 'choice',

                    listItem: {
                      labelOnly: true,
                      list: ['대리', '과장', '부장'],
                    },
                  },

                  change: (info) => {
                    console.log(info, info.value);
                  },
                },

                {
                  label: '라디오 초이스',
                  name: 'choice1',
                  //width: 150,
                  gap: [10, 20],
                  defaultValue: '대리',
                  renderer: {
                    type: 'choice',
                    listItem: {
                      multiple: false,
                      labelOnly: true,
                      list: ['대리', '과장', '부장'],
                    },
                  },

                  change: (info) => {
                    console.log(info, info.value);
                  },
                },
              ],
            },
          ],
        ],
      },
      fields: colItem,
      items: aaa,
    });
  }
</script>
