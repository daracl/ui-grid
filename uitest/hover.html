<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Dara selection</title>
  </head>

  <body>
    <div class="grid-view-area">
      <div id="sample" style="height: calc(100vh - 200px); width: 100%"></div>
    </div>
  </body>
</html>

<script src="./data/sampleConfig.js" type="text/javascript"></script>
<script src="./data/employee.js" type="text/javascript"></script>
<script type="module" src="/src/index.ts"></script>

<script>
  var gridObj;

  function loadGrid(theme, hoverMode) {
    const jsonInfo = getItem();

    gridDraw(document.getElementById('sample'), jsonInfo.items, jsonInfo.fields, theme, hoverMode);
  }

  document.addEventListener('DOMContentLoaded', function () {
    loadGrid(G_GRID_THEME, 'cell');
  });

  function getItem() {
    let items = [];
    let fields = [];

    items = GRID_EMPLOYEE_DATA;
    fields = [
      {
        name: 'name',
        label: '이름',
        width: 80,
        align: 'center',
      },
      {
        name: 'age',
        label: '나이',
        width: 50,
        renderer: { type: 'number' },
      },
      {
        name: 'email',
        label: '이메일',
        width: 120,
      },
      {
        name: 'birth',
        label: '생년월일',
        width: 120,
        editRenderer: {
          type: 'date',
        },
      },
      {
        name: 'position',
        label: '직책',
        width: 80,
      },
      {
        name: 'salary',
        label: '월급',
        width: 100,
        renderer: { type: 'number' },
        displayFormat: {
          type: 'number',
          format: '₩ 0,0 원',
        },
      },
      {
        name: 'desc',
        label: '설명',
        width: 200,
        whiteSpace: 'wrap',
      },
    ];

    return {
      items: items,
      fields: fields,
    };
  } //test

  let toolbarSelectionMode = 'cell';
  function gridDraw(element, items, fields, theme, selectMode) {
    gridObj = Daracl.grid.create(element, {
      //style: 'striped',
      selectionMode: 'cell', // row, cell, multiRow, multiCell, none// 선택 방법.
      hoverMode: selectMode,
      enableWidthFixed: false,
      enableTooltip: true, // tooltip flag
      theme: theme,
      height: 480,
      aside: {
        lineNumber: { enabled: true },
        rowCheckbox: {
          enabled: true,
          width: 50,
          //, allowMultiSelect: false
        },
      },
      colOptions: {
        maxWidth: 1024,
      },
      valueFilter: function (colInfo, objValue) {
        return objValue[colInfo.key];
      },
      fields: fields,
      items: items,
      body: {
        row: {
          height: 60,
          selectRowOnCellClick: true,
        },
      },
      toolbar: {
        enabled: true,
        height: 40,
        defaultValues: {
          mode: toolbarSelectionMode,
        },
        items: [
          [
            {
              position: 'left',
              children: [
                {
                  label: '선택모드',
                  name: 'mode',
                  //width: 150,
                  gap: [10, 20],

                  renderer: {
                    type: 'choice',
                    listItem: {
                      multiple: false,
                      list: [
                        {
                          label: '셀(cell)',
                          value: 'cell',
                        },
                        {
                          label: '로우(row)',
                          value: 'row',
                        },
                        {
                          label: 'None(none)',
                          value: 'none',
                        },
                      ],
                    },
                  },

                  change: (info) => {
                    toolbarSelectionMode = info.value;
                    loadGrid(theme, info.value);
                  },
                },
              ],
            },
          ],
        ],
      },
    });
  }
</script>
