  const THEME_KEY = 'grid-theme';
  const theme = localStorage.getItem(THEME_KEY);

  if (theme) setMainTheme(theme);

  function setMainTheme(theme, persist = false) {
    const bodyElement = document.body;

    if (gridObj) gridObj.setTheme(theme);

    bodyElement.setAttribute('data-dg-theme', theme);

    if (persist) {
      localStorage.setItem(THEME_KEY, theme);
    }
  }

  function fn_button() {
    const themeElement = document.getElementById('theme');

    themeElement.addEventListener('change', (e) => {
      const value = themeElement.value;

      if (value) {
        setMainTheme(value, true);
      }
    });
  }

  function fn_init(initFlag) {
    const themeElement = document.getElementById('theme');

    if (themeElement) themeElement.value = theme ?? 'light';

  function generateItems(itemCount, batchSize = 500) {
    const items = [];
    let i = 0;

    function processBatch() {
      const end = Math.min(i + batchSize, itemCount);

      const nationalCodes = ['ko', 'en', 'zh', 'jp'];

      for (; i < end; i++) {
        items.push({
          a: 'aaasdfasdfasdfasdfasdfasdfa' + i,
          b: 'ddd_' + i + 'asdf',
          c: i * 10000,
          d: nationalCodes[Math.floor(Math.random() * nationalCodes.length)],
          e: `<span style="width:100px;height:150px;"><a href="javascript:alert('row'+ ${i});">test ${i}</a><br><span>${i}</span></span>`,
          f: 'ffff' + i,
          g: 'ggggg' + i,
          h: i,
          i: 'iiii' + i,
          j: 'jjjj' + i,
          k: i % 2 === 0 ? 'Y' : 'N',
          m: '한글테스트 : ' + i,
          s: generateRandomNumbers(1, 100, 6),
          t: generateRandomNumbers(1, 100, 6),
          z: Math.floor(Math.random() * 201) - 100,
          idx: i,
        });
      }

      if (i < itemCount) {
        setTimeout(processBatch, 0); // 다음 배치 처리
      }
    }

    processBatch();
    return items;
  }

  function getRandomFloatFromInput(a, b) {
    const min = Math.min(a, b);
    const max = Math.max(a, b);
    return Math.floor(Math.random() * (max - min) + min);
  }

  function generateRandomNumbers(start, end, count) {
    if (start > end) {
      throw new Error('시작 값은 끝 값보다 작거나 같아야 합니다.');
    }
    if (count <= 0) {
      throw new Error('생성할 숫자의 개수는 1 이상이어야 합니다.');
    }

    const result = [];
    for (let i = 0; i < count; i++) {
      const random = Math.floor(Math.random() * (end - start + 1)) + start;
      result.push(random);
    }
    return result;
  }
