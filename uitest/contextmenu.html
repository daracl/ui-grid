<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <title>Dara summary</title>
</head>

<body>
  <div class="grid-view-area">
    <div id="sample" style="height: calc(100vh - 200px); width: 100%"></div>
  </div>
</body>

</html>

<script src="./data/sampleConfig.js" type="text/javascript"></script>
<script src="./data/employee.js" type="text/javascript"></script>
<script type="module" src="/src/index.ts"></script>

<style>
  .salary-5 {
    background-color: #f30606 !important;
  }

  .salary-10 {
    background-color: #e48140 !important;
  }

  .salary-15 {
    background-color: #b6cc65 !important;
  }

  .salary-up {
    background-color: #4df398 !important;
  }
</style>
<script>
  var gridObj;

  function fn_init(initFlag) {
    const jsonInfo = getItem(4, 100, 20);

    gridDraw(document.getElementById('sample'), jsonInfo.items, jsonInfo.fields);
  }

  document.addEventListener('DOMContentLoaded', function () {
    fn_init(true);
  });

  var itemIdx = 0;
  function getItem(type, itemCount, cellCount) {
    itemIdx++;
    let items = [];
    let fields = [];

    const orginItemCount = itemCount;

    itemCount = orginItemCount == 0 ? 1 : itemCount;

    items = GRID_EMPLOYEE_DATA;
    fields = [
      {
        name: 'name',
        label: '이름',
        width: 80,
        align: 'center',
      },
      {
        name: 'age',
        label: '나이',
        width: 50,
        renderer: { type: 'number' },
      },
      {
        name: 'email',
        label: '이메일',
        width: 120,
      },
      {
        name: 'birth',
        label: '생년월일',
        width: 120,
        editRenderer: {
          type: 'date',
          /*
        , rule: {
          minimum: -100
          , maximum: 100
        }
          */
        },
      },
      {
        name: 'position',
        label: '직책',
        width: 80,
      },
      {
        name: 'salary',
        label: '월급',
        width: 100,
        renderer: { type: 'number' },
        displayFormat: {
          type: 'number',
          format: '₩ 0,0 원',
        },
      },
      {
        name: 'desc',
        label: '설명',
        width: 200,
        whiteSpace: 'wrap',
      },
    ];

    items = orginItemCount == 0 ? [] : items;

    return {
      items: items,
      fields: fields,
    };
  } //test

  function gridDraw(element, aaa, colItem) {
    gridObj = Daracl.grid.create(
      element,
      {
        selectionMode: 'multiCell', // row , cell , multiRow , multiCell	// 선택 방법.
        theme: G_GRID_THEME,
        height: 480,
        aside: {
          lineNumber: { enabled: true },
        },
        colOptions: {
          maxWidth: 1024,
        },
        valueFilter: function (colInfo, objValue) {
          return objValue[colInfo.key];
        },


        scroll: {
          enableWheelInContainer: true,
          vertical: {
            enable1: false,
            onUpdate: function (item) {
              // 스크롤 업데이트.
              //console.log(item);
              //return true;
            },
          },
          horizontal: {
            enableWheel: true,
          },
        },

        fields: colItem,
        items: aaa,


        contextMenu: {
          enableHeader: true,
          beforeActivate: function (info) {
            const field = info.field;
            const item = info.item;
            if (item) {
              gridObj.changeContextMenuHeader(item[field.name]);
            }
          },
          callback: function (item) {
            console.log(item.key, item);

            if (item.key == 'copy') {
              gridObj.copyData();
            }
          },
          items: [
            { key: 'refresh', label: '새로고침' },
            {
              divider: true,
            },
            {
              key: 'copy',
              label: '복사',
              hotkey: 'Ctrl+C',
              callback: function (item) {
                console.log('direct copy callback : ', item.key, item);

                if (item.key == 'copy') {
                  gridObj.copyData();
                }
              },
            },
            {
              key: 'sql_create',
              label: 'sql생성',
              disabled: true,
              children: [
                { key: 'selectStar', label: 'select *' },
                { key: 'select', label: 'select column' },
                { key: 'insert', label: 'insert' },
                { key: 'update', label: 'update' },
                { key: 'delete', label: 'delete' },
                { key: 'drop', label: 'drop' },
              ],
            },
            {
              key: 'download',
              label: 'download',
              children: [
                { checkbox: true, label: 'selet data', key: 'sqlGridResultSelect' },
                { divider: true },
                { key: 'download_excel', label: 'EXCEL' },
                { key: 'download_csv', label: 'CSV' },
                { key: 'download_xml', label: 'XML' },
                { key: 'download_json', label: 'json' },
              ],
            },
            {
              key: 'create_ddl',
              label: 'DDL 보기',
              hotkey: 'Ctrl+shift+C',
            },
            {
              key: 'mybatis-sql_create',
              label: 'mybatis Sql생성',
              children: [
                { key: 'mybatis_insert', label: 'insert', mode: 'insert', param_yn: 'Y' },
                { key: 'mybatis_update', label: 'update', mode: 'update', param_yn: 'Y' },
                { key: 'mybatis_delete', label: 'delete', mode: 'delete', param_yn: 'Y' },
              ],
            },
            {
              key: 'export',
              label: '내보내기',
              children: [
                { key: 'export_data', label: '데이타 내보내기' },
                { key: 'export_column', label: '컬럼정보 내보내기' },
              ],
            },
          ],
        },
      }
    );
  }
</script>
