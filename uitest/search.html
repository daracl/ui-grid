<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <title>Dara Search</title>
</head>

<body>
  <div class="grid-view-area">
    <div id="sample" style="height: calc(100vh - 50px); width: 100%"></div>
  </div>
</body>

</html>

<script src="./data/sampleConfig.js" type="text/javascript"></script>
<script src="./data/employee.js" type="text/javascript"></script>
<script type="module" src="/src/index.ts"></script>

<script>
  var gridObj;

  function loadGrid(initFlag) {
    const jsonInfo = getItem();

    gridDraw(document.getElementById('sample'), jsonInfo.items, jsonInfo.fields);
  }

  document.addEventListener('DOMContentLoaded', function () {
    loadGrid(true);
  });

  function getItem() {
    let items = GRID_EMPLOYEE_DATA;
    let fields = GRID_EMPLOYEE_FIELDS;

    return {
      items: items,
      fields: fields,
    };
  }

  function gridDraw(element, aaa, colItem, message) {
    gridObj = Daracl.grid.create(element, {
      style: 'striped',
      selectionMode: 'multiCell', // row , cell , multiRow , multiCell	// 선택 방법.
      theme: G_GRID_THEME,
      search: {
        enabled: true,
        hideNonMatched: true,
        enabledColumnFix: true,
        click: false,
        mode: 'simple', //'full'
        width: 700,
        height: 250,
        onlyCloseButton: true,
        useRememberValue: true,
        callback: (data) => {
          //console.log(data)
        },
        rememberValue: { field: '$all', val: 'asdf' },
      },
      fields: colItem,
      items: aaa,
    });
  }
</script>
