<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="./asset/examples.css" />
    <title>서버 연동 (dataSource)</title>
  </head>

  <body class="example-page">
    <header class="page-header">
      <div><a href="./index.html">DaraGrid / UI 테스트</a><h1>서버 연동 (dataSource)</h1></div>
    </header>
    <section class="example-content" aria-label="예제 미리보기">
      <div style="padding: 8px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center">
        <input id="keyword" placeholder="이름 검색" />
        <button id="btnSearch">searchRemote</button>
        <button id="btnReload">reload</button>
        <button id="btnAdd">행 추가</button>
        <button id="btnDelete">선택 행 삭제(soft)</button>
        <button id="btnSave">save</button>
        <button id="btnRemove">removeRemote</button>
        <button id="btnDiscard">변경 버리고 reload</button>
        <span id="log" style="font-size: 12px"></span>
      </div>
      <div class="grid-view-area">
        <div id="sample" style="height: calc(100vh - 140px); width: 100%"></div>
      </div>
    </section>
  </body>
</html>
<script src="./data/sampleConfig.js" type="text/javascript"></script>
<script type="module" src="/src/index.ts"></script>
<script src="./asset/pages/remote.js"></script>
