<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Dara data sorting</title>
  </head>

  <body>
    <div>
      theme
      <select id="theme">
        <option value="light" selected>light</option>
        <option value="dark">dark</option>
      </select>
    </div>
    <div class="grid-view-area">
      <div id="sample" style="height: calc(100vh - 200px); width: 100%"></div>
    </div>
  </body>
</html>
<script src="./data/employee.js" type="text/javascript"></script>
<script type="module" src="/src/index.ts"></script>

<script>
  var gridObj;
  const THEME_KEY = 'grid-theme';
  const theme = localStorage.getItem(THEME_KEY);

  if (theme) setMainTheme(theme);

  function setMainTheme(theme, persist = false) {
    const bodyElement = document.body;

    bodyElement.setAttribute('data-dg-theme', theme);

    if (gridObj) gridObj.setTheme(theme);

    if (persist) {
      localStorage.setItem(THEME_KEY, theme);
    }
  }

  function fn_button() {
    const themeElement = document.getElementById('theme');

    themeElement.addEventListener('change', (e) => {
      const value = themeElement.value;

      if (value) {
        setMainTheme(value, true);
      }
    });
  }

  function fn_init(initFlag) {
    const themeElement = document.getElementById('theme');

    if (themeElement) themeElement.value = theme ?? 'light';

    const jsonInfo = getItem();

    gridDraw(document.getElementById('sample'), jsonInfo.items, jsonInfo.fields);
  }

  document.addEventListener('DOMContentLoaded', function () {
    fn_button();
    fn_init(true);
  });

  function getItem() {
    let items = GRID_EMPLOYEE_DATA;
    let fields = [];

    fields = [
      {
        name: 'name',
        label: '이름',
        align: 'center',
        width: 80,
      },
      {
        name: 'position',
        label: '직책',
        width: 150,
      },
      {
        name: 'age',
        label: '나이',
        align: 'center',
        width: 50,
      },
      {
        name: 'email',
        label: '이메일',
        width: 200,
      },
      {
        name: 'birth',
        label: '생년월일',
        width: 120,
        align: 'center',
        editRenderer: {
          type: 'date',
          /*
          , rule: {
            minimum: -100
            , maximum: 100
          }
            */
        },
      },

      {
        name: 'salary',
        label: '월급',
        width: 100,
        align: 'right',
        displayFormat: {
          type: 'number',
          format: '₩ 0,0 원',
        },
        headerHelp(fieldInfo) {
          const field = fieldInfo.field;
          return field.label + ' // field 설정';
        },
      },
      {
        name: 'desc',
        label: '설명',
        width: 200,
      },
    ];

    return {
      items: items,
      fields: fields,
    };
  } //test

  function gridDraw(element, aaa, colItem, message) {
    gridObj = Daracl.grid.create(element, {
      editable: true,
      rowIdField: 'email',
      styleClass: 'striped',
      selectionMode: 'multiple-cell', // row , cell , multiple-row , multiple-cell	// 선택 방법.
      enableWidthFixed: false,
      enableTooltip: true, // tooltip flag
      theme: document.getElementById('theme').value,
      height: 335,
      width: 'auto',
      header: {
        sort: {
          customSorting: (data, sortFields, sortOpts) => {
            const { nullsLast = true } = sortOpts ?? {};

            console.log(data);

            return [...data]
              .sort((a, b) => {
                for (const { name, ascOrder = true } of sortFields) {
                  const aValue = a[name];
                  const bValue = b[name];

                  const aIsNull = aValue == null;
                  const bIsNull = bValue == null;

                  if (aIsNull || bIsNull) {
                    if (aIsNull && bIsNull) continue;

                    return aIsNull ? (nullsLast ? 1 : -1) : nullsLast ? -1 : 1;
                  }

                  let result = 0;

                  if (typeof aValue === 'string' && typeof bValue === 'string') {
                    result = aValue.localeCompare(bValue);
                  } else {
                    if (aValue > bValue) result = 1;
                    else if (aValue < bValue) result = -1;
                  }

                  if (result !== 0) {
                    return ascOrder ? result : -result;
                  }
                }

                return 0;
              })
              .map((item) => ({ id: item.email }));
          },
        },
      },
      fields: colItem,
      items: aaa,
    });
  }
</script>
