<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Dara paging</title>
  </head>

  <body>
    <div class="grid-view-area">
      <div id="sample" style="height: calc(100vh - 50px); width: 100%"></div>
    </div>
  </body>
</html>
<script src="./data/sampleConfig.js" type="text/javascript"></script>
<script src="./data/employee.js" type="text/javascript"></script>
<script type="module" src="/src/index.ts"></script>

<script>
  var gridObj;

  function loadGrid(initFlag) {
    const jsonInfo = getItem();

    gridDraw(document.getElementById('sample'), jsonInfo.items, jsonInfo.fields);
  }

  document.addEventListener('DOMContentLoaded', function () {
    loadGrid(true);
  });

  function getItem() {
    let items = GRID_EMPLOYEE_DATA;
    let fields = GRID_EMPLOYEE_FIELDS;

    return {
      items: items,
      fields: fields,
    };
  }

  function gridDraw(element, aaa, colItem) {
    gridObj = Daracl.grid.create(element, {
      style: 'striped',
      selectionMode: 'multiCell',
      theme: G_GRID_THEME,
      height: 324,
      aside: {
        lineNumber: { enabled: true },
      },
      fields: colItem,
      items: aaa,
      paging: {
        countPerPage: 10,
        currPage: 1,
      },
      footer: {
        enabled: true,

        height: 35,
        paging: {
          enabled: true,

          /**
           * 위치 값
           */
          position: 'center',
          formatPosition: 'right',
          /**
           * 페이지 메시지 포멧
           */
          format: '{{start}} - {{end}} of {{total}}',

          // 페이지 콜백
          callback1: function (arg) {
            console.log(arg);
            //gridObj.setItems(aaa);
          },
        },
      },
    });
  }
</script>
