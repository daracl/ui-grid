<!DOCTYPE html>
<html>

<body>
  <div class="header">
    <div class="form-button">
      <button type="button" onclick="formObj.addItem()">Add</button>
      <button type="button" onclick="formObj.getValue()">getValue</button>
      <button type="button" onclick="formObj.getValuePromise()">getValue(true)</button>
      <button type="button" onclick="formObj.setValue()">setValue()</button>

    <div>
      Theme : <label>Light<input type="radio" name="theme-toggle" value="light" checked="true"></label>
      <label>Dark<input type="radio" name="theme-toggle" value="dark"></label>

<style>
  .form-button {
    text-align: center;
  }

  :root {
    --bg: #ffffff;
    --bg-color: #070d19;

  }

  body.dark {
    --bg: #070d19;
    --bg-color: #ffffff;

  }

  body {
    background-color: var(--bg);
  }

  .header {
    color: var(--bg-color);
  }
</style>
<script>

  const THEME_KEY = "grid-theme";
  const theme = localStorage.getItem(THEME_KEY);

  if (theme) setMainTheme(theme);

  function setMainTheme(theme, persist = false) {
    const classList = document.body.classList;

    classList.remove("light", "dark");

    classList.add(theme);

    if (persist) {
      localStorage.setItem(THEME_KEY, theme);
    }
  }

  function load() {
    // theme
    const toggler = document.querySelectorAll('[name="theme-toggle"]');
    const theme = localStorage.getItem(THEME_KEY);

    if (toggler) {
      if (theme === "dark") {
        document.querySelector('[name="theme-toggle"][value="dark"]').checked = true;
      }

      toggler.forEach((el) => {
        el.addEventListener("click", (e) => {
          setMainTheme(el.value, true);
        });
      })
    }

    var aaa, colItem;

    $('asdfasdf').removeAttr('class');

    var item = getItem(itemType);

    aaa = item.aaa;
    colItem = item.colItem;


    if (parseInt($('#itemCount').val(), 10) == 1) {
      aaa = [];
    }

    gridDraw(document.getElementById('sample'), aaa, colItem);

    //gridDraw('#asdfasdf1',aaa, colItem);
    //gridDraw('#asdfasdf1',aaa, colItem);

  }
  load();


  var itemIdx = 0;
  function getItem(type) {
    itemIdx++;
    var aaa = [];
    var colItem = [];
    var itemCount = parseInt($('#itemCount').val(), 10);
    var cellCount = parseInt($('#cellCount').val(), 10);

    if (type == 1) {
      for (var i = 0; i < itemCount; i++) {
        aaa.push({
          a: 'aaasdfasdfasdfasdfasdfasdfa' + i
          , b: 'ddd_' + i + 'asdf'
          , c: (i * 10000)
          , d: i == 0 ? 'KOREA' : 'ddd_' + i
          , e: i % 3 == 0 ? null : 'null아님_' + i
          , f: 'ffff' + i
          , g: 'ggggg' + i
          , h: i
          , i: 'iiii' + i
          , j: 'jjjj' + i
          , idx: i
        });
      }
      colItem = [
        {
          label: 'a+b',
          children: [
            { key: 'a', label: '에이에이에이에이에이에이', width: 100, sort: true, editable: false }
            , {
              key: 'b', label: '비', width: 100, visible: true, colClick: function (idx, item) { console.log(idx, item) }, styleClass: function (rowInfo) {
                if (rowInfo.rowItemIdx % 3 == 0) {
                  return 'pub-bg-primary';
                } else if (rowInfo.rowItemIdx % 3 == 1) {
                  return 'pub-bg-success';
                } else if (rowInfo.rowItemIdx % 3 == 2) {
                  return '';
                }
              }
            }
          ]
        }
        , {
          key: 'c', label: '씨', width: 100, align: 'center', type: 'money', renderer: {
            type: 'link'
            //,url : 'http://localhost?aaa={{a}}'
            , click1: function (item) {
              console.log('link ', item)
            }
          }
        }
        , {
          key: 'd', label: '디', width: 100, type: 'text', renderer: {
            type: 'dropdown'
            , labelField: 'name'
            , valueField: 'cd'
            , list: [
              { name: 'USA', 'cd': 'USA' }
              , { name: 'KOREA', 'cd': 'KOREA' }
              , { name: 'CHINA', 'cd': 'CHINA' }
              , { name: 'KOREA1', 'cd': 'KOREA1' }

              /*	,'KOREA2'
                ,'KOREA3'
                ,'KOREA4'
                ,'KOREA5'
                ,'KOREA6'
                ,'KOREA7'
                ,'KOREA8'
                ,'KOREA9'
                ,'KOREA10'
                ,'KOREA11'
            */
            ]
          }
        }
        , {
          key: 'e', label: '이', width: 100, renderer: {
            type: 'checkbox'
          }
        }
        , {
          key: 'f', label: 'f', width: 100, align: 'center', renderer: {
            type: 'button'
            , label: 'button click'
            , click: function (info) {
              console.log(info);
            }
          }
        }
        , {
          key: 'g', label: 'g', width: 100, align: 'center', visible: false, renderer: {
            type: 'image1'
            , src: './image/{{g}}'
          }
        }
        , {
          key: 'h', label: 'h', width: 100, align: 'center', type: 'number', visible: true, renderer: {
            type: 'number'
          }
        }
        //,{key :'d', label:'디', hidden:true}
      ]
    } else {

      for (var i = 0; i < itemCount; i++) {
        var tmpItem = {};

        for (var j = 0; j < cellCount; j++) {
          var colName = 'col' + itemIdx + '_' + j;
          if (j == 0) {
            tmpItem[colName] = i + j;
          } else {
            tmpItem[colName] = ('cont' + i + " _ " + j);
          }

          //tmpItem[colName] = j< 30 ? ('cont'+i+" _ "+j) :'';
        }

        aaa.push(tmpItem)
      }

      if (aaa.length > 0) {
        colFirstItem = aaa[0];

        var keyIdx = 0;
        for (var key in colFirstItem) {

          var addColItem = {
            key: key
            , label: '한글' + key
            , width: 45
            , type: (keyIdx == 0 ? 'number' : 'string')
            , editor: true
          }

          if (keyIdx == 1) {
            addColItem.editor = {
              type: 'text'
            }
            addColItem.width = 100;
            addColItem.tooltip = {
              formatter: function (obj) {
                return 'asdfasdf'
              }
            }
          } else if (keyIdx == 2) {
            addColItem.editor = {
              type: 'select'
              , items: [
                { CODE: '111', LABEL: "파폭" }, { CODE: '2222', LABEL: "크롬" }
              ]
            }
          } else if (keyIdx == 3) {
            addColItem.editor = {
              type: 'textarea'
            }
          } else if (keyIdx == 4) {
            addColItem.editor = {
              type: 'number'
            }
          }
          colItem.push(addColItem);

          keyIdx++;
        }
      }
    }

    return {
      "aaa": aaa
      , "colItem": colItem
    };
  }//test

  function gridDraw(element, aaa, colItem) {

      , widthFixed: false

      , theme: $('#themeInfo').val()
      //,height: 360
      , asideOptions: {
        lineNumber: { enabled: true }

          , key: 'checkbox'
          , name: 'V'

        }

        maxWidth: 1024

            //console.log(item);

        }

      }
      , message: {
        'asdf': ''

      , navigation: {

        }

      , setting: {

        , mode: 'full'
        , width: 700

        , btnClose: true
        , callback: function (data) {
          //console.log(data)
        }
        , configVal: { search: { field: '$all', val: 'asdf' } }
      }
      , toolbar: {
        enabled: true

        , items: [
          {
            search: true,
            callback: (keyword) => {

            }
          }

          , {
            divider: true
          }
          , {
            key: 'test'
            , renderType: 'dropdown'
            , style: {
              valueWidth: '200px'
            }
            , listItem: {
              list: [
                { label: 'asdf', value: 1 }
                , { label: 'asdf2', value: 2 }
                , { label: 'asdf3', value: 3 }
              ]
            }
            , change: (aa) => {
              console.log(aa);
            }
          }
          , {

            , style: {

            }
          }
          , {
            label: 'button'
            , renderType: 'button'

              console.log(aa);
            }
          }

        ]
      }
      , tColItem: colItem
      , bodyOptions: {

          //console.log('cellDblClick', itemInfo)

        // 방향키 컨트롤 .

</script>
