<body>

  </div>
  <textarea id="dropTextArea" style="width:100%" rows="2"></textarea>
  <table style="width:95%;height:100%;">
    <tr>
      <td>
        <div class="asdfasdfWrapper">
          <pre id="textTest"
            style="display:inline-block;white-space: pre;position: relative;padding:0px;margin:0px;">SORT_ORDER</pre>
          <div id="sample" style="height:350px;width:100%;"></div>
        </div>
      </td>

    </tr>
    <tr>
      <td>
        <div class="asdfasdfWrapper">

</html>
<style>
  .form-button {
    text-align: center;
  }

  :root {
    --bg: #ffffff;
    --bg-color: #070d19;

  }

  body.dark {
    --bg: #070d19;
    --bg-color: #ffffff;

  }

  body {
    background-color: var(--bg);
  }

  .header {
    color: var(--bg-color);
  }
</style>
<script>

  const THEME_KEY = "grid-theme";
  const theme = localStorage.getItem(THEME_KEY);

  if (theme) setMainTheme(theme);

  function setMainTheme(theme, persist = false) {
    const classList = document.body.classList;

    classList.remove("light", "dark");

    classList.add(theme);

    if (persist) {
      localStorage.setItem(THEME_KEY, theme);
    }
  }

  function fn_init() {
    // theme
    const toggler = document.querySelectorAll('[name="theme-toggle"]');
    const theme = localStorage.getItem(THEME_KEY);

    if (toggler) {
      if (theme === "dark") {
        document.querySelector('[name="theme-toggle"][value="dark"]').checked = true;
      }

      toggler.forEach((el) => {
        el.addEventListener("click", (e) => {
          setMainTheme(el.value, true);
        });
      })
    }

    let aaa, colItem;
    const itemType = 1;

    let item = getItem(itemType);

    aaa = item.aaa;
    colItem = item.colItem;

    gridDraw(document.getElementById('sample'), aaa, colItem);

  }

  document.addEventListener('DOMContentLoaded', function () {
    fn_init();
  });


  var itemIdx = 0;
  function getItem(type) {
    itemIdx++;
    let aaa = [];
    let colItem = [];
    let itemCount = parseInt(document.getElementById("itemCount").value, 10);
    let cellCount = parseInt(document.getElementById("cellCount").value, 10);

    if (type == 1) {
      for (let i = 0; i < itemCount; i++) {
        aaa.push({
          a: 'aaasdfasdfasdfasdfasdfasdfa' + i
          , b: 'ddd_' + i + 'asdf'
          , c: (i * 10000)
          , d: i == 0 ? 'KOREA' : 'ddd_' + i
          , e: i % 3 == 0 ? null : 'null아님_' + i
          , f: 'ffff' + i
          , g: 'ggggg' + i
          , h: i
          , i: 'iiii' + i
          , j: 'jjjj' + i
          , idx: i
        });
      }
      colItem = [
        {
          label: 'a+b',
          children: [
            { name: 'a', label: '에이에이에이에이에이에이', width: 150, sort: true, editable: false }
            , {
              name: 'b', label: '비', width: 100, visible: true, colClick: function (idx, item) { console.log(idx, item) }, styleClass: function (rowInfo) {
                if (rowInfo.rowItemIdx % 3 == 0) {
                  return 'pub-bg-primary';
                } else if (rowInfo.rowItemIdx % 3 == 1) {
                  return 'pub-bg-success';
                } else if (rowInfo.rowItemIdx % 3 == 2) {
                  return '';
                }
              }
            }
          ]
        }
        , {
          name: 'c', label: '씨', width: 100, align: 'center', type: 'money', renderer: {
            type: 'link'
            //,url : 'http://localhost?aaa={{a}}'
            , click1: function (item) {
              console.log('link ', item)
            }
          }
        }
        , {
          name: 'd', label: '디', width: 100, type: 'text', renderer: {
            type: 'dropdown'
            , labelField: 'name'
            , valueField: 'cd'
            , list: [
              { name: 'USA', 'cd': 'USA' }
              , { name: 'KOREA', 'cd': 'KOREA' }
              , { name: 'CHINA', 'cd': 'CHINA' }
              , { name: 'KOREA1', 'cd': 'KOREA1' }

              /*	,'KOREA2'
                ,'KOREA3'
                ,'KOREA4'
                ,'KOREA5'
                ,'KOREA6'
                ,'KOREA7'
                ,'KOREA8'
                ,'KOREA9'
                ,'KOREA10'
                ,'KOREA11'
            */
            ]
          }
        }
        , {
          name: 'e', label: '이', width: 100, align: 'right', renderer: {
            type: 'checkbox'
          }
        }
        , {
          name: 'f', label: 'f', width: 100, align: 'center', renderer: {
            type: 'button'
            , label: 'button click'
            , click: function (info) {
              console.log(info);
            }
          }
        }
        , {
          name: 'g', label: 'g', width: 100, align: 'center', visible: false, renderer: {
            type: 'image1'
            , src: './image/{{g}}'
          }
        }
        , {
          name: 'h', label: 'h', width: 100, align: 'right', type: 'number', visible: true, renderer: {
            type: 'number'
          }
        }
        //,{key :'d', label:'디', hidden:true}
      ]
    } else {

      for (let i = 0; i < itemCount; i++) {
        let tmpItem = {};

        for (let j = 0; j < cellCount; j++) {
          let colName = 'col' + itemIdx + '_' + j;
          if (j == 0) {
            tmpItem[colName] = i + j;
          } else {
            tmpItem[colName] = ('cont' + i + " _ " + j);
          }

          //tmpItem[colName] = j< 30 ? ('cont'+i+" _ "+j) :'';
        }

        aaa.push(tmpItem)
      }
      let colFirstItem;
      if (aaa.length > 0) {
        colFirstItem = aaa[0];

        let keyIdx = 0;
        for (let key in colFirstItem) {

          let addColItem = {
            name: key
            , label: '한글' + key
            , width: 45
            , type: (keyIdx == 0 ? 'number' : 'string')
            , editor: true
          }

          if (keyIdx == 1) {
            addColItem.colspan = 2;
            addColItem.editor = {
              type: 'text'
            }
            addColItem.width = 100;
            addColItem.tooltip = {
              formatter: function (obj) {
                return 'asdfasdf'
              }
            }
          } else if (keyIdx == 2) {
            addColItem.editor = {
              type: 'select'
              , items: [
                { CODE: '111', LABEL: "파폭" }, { CODE: '2222', LABEL: "크롬" }
              ]
            }
          } else if (keyIdx == 3) {
            addColItem.editor = {
              type: 'textarea'
            }
          } else if (keyIdx == 4) {
            addColItem.editor = {
              type: 'number'
            }
          }
          colItem.push(addColItem);

          keyIdx++;
        }
      }
    }

    return {
      "aaa": aaa
      , "colItem": colItem
    };
  }//test

  function gridDraw(element, aaa, colItem) {
    let gridObj = Daracl.grid.create(element, {
      editable: true
      , selectionMode: 'multiple-cell'	// row , cell , multiple-row , multiple-cell	// 선택 방법. 
      , enableWidthFixed: false
      , enableTooltip: true			// tooltip flag
      , theme: document.getElementById("theme").value
      , fixedLeftIndex: 2
      , fixedRightIndex: 6
      //,height: 360
      , aside: {
        lineNumber: { enabled: true }
        , rowCheckbox: {
          enabled: true
          , key: 'checkbox'
          , name: 'V'
          , width: 25
        }
      }
      , colOptions: {
        maxWidth: 1024
      }
      , valueFilter: function (colInfo, objValue) {
        return objValue[colInfo.key];
      }
      , header: {
        view: true
        , sort: {
          //정렬 활성화 여부
          enabled: true
          // null value 를 항상 끝으로 유지 할지 여부
          , nullsLast: true
          // custom sorting function
          //,customSorting: ()=>{console.log(arguments)}
        }
        //,height :30
        , resize: {
          enabled: true
          , update: function (item) {
            //console.log(item);
          }
          , minWidth: 100
          , maxWidth: 1000
        }
        , contextMenu: {
          callback: (key, sObj) => {
            console.log('header context', this, key, sObj);
          }
          , items: [
            { key: "refresh", "name": "새로고침" }
          ]
        }
        , help: {
          enabled: true	// header help btn 활성 여부.
          , title: 'test'
          , click: (clickInfo) => {	// click event
            console.log('clickInfo : ', clickInfo)
          }
          , dblclick: (clickInfo) => {	// click event
            console.log('clickInfo : ', clickInfo)
          }
        }
        , drag: {
          enabled: true
          , dropSelector: '#dropTextArea'
          , dropCallback: (data) => {

          }
        }
      }
      , finder: {
        enabled: true
        , enableColumnFix: true
        , click: false
        , mode: 'full'
        , width: 700
        , height: 250
        , onlyCloseButton: true
        , useRememberValue: true
        , callback: (data) => {
          //console.log(data)
        }
        , rememberValue: { field: '$all', val: 'asdf' }
      }
      , toolbar: {
        enabled: false

        , items: [
          {
            search: true,
            callback: (keyword) => {

            }
          }

          , {
            divider: true
          }
          , {
            key: 'test'
            , renderType: 'dropdown'
            , style: {
              valueWidth: '200px'
            }
            , listItem: {
              list: [
                { label: 'asdf', value: 1 }
                , { label: 'asdf2', value: 2 }
                , { label: 'asdf3', value: 3 }
              ]
            }
            , change: (aa) => {
              console.log(aa);
            }
          }
          , {
            key: 'test22'
            , renderType: 'text'
            , style: {
              valueWidth: '150px'
            }
            , change: (aa) => {
              console.log(aa);
            }
          }
          , {
            label: 'button'
            , renderType: 'button'
            , click: (aa) => {
              console.log(aa);
            }
          }

        ]
      }
      , scroll: {
        vertical: {
          onUpdate: function (item) {	// 스크롤 업데이트. 
            //console.log(item);
            //return true; 
          }
        }
        , horizontal: {
          enableWheel: false
        }
      }
      , message: {
        'asdf': ''
        , empty: '데이타 없음'
        //,empty: function (){ return '데이타 없음'}

      }
      , footer: {
        enabled: true
        , enableStatus: true
        , enableSelectionInfo: false
        , height: 32
        , position: 'center'
        , callback: function (arg) {
          console.log(arg);
          //gridObj.setData(aaa);
        }
        , statusFormat: function (arg) {
          console.log(arg);
        }

      }
      , paging: {
        totalCount: 155
        , currPage: 9
        , countPerPage: 10
        , unitPage: 10
      }
      , fields: colItem
      , items: aaa
      , body: {
        cellDblClick: function (itemInfo) {
          //console.log('cellDblClick', itemInfo)
        }
        // 방향키 컨트롤 . 
        , keyNavHandler: function (moveInfo) {
          console.log(moveInfo);
        }
        , row: {
          dblClickCheck: false
          , click: function (itemInfo) {
            //console.log('rowOptions click' ,itemInfo)
            return;
          }
          , dblClick1: function () {
            console.log('dblclick')
          }

          , pasteBefore: function (a) {
            console.log('pasteBefore', a);
            return a;
          }
          , pasteAfter: function (a) {
            console.log('pasteAfter', a)
          }
          , contextMenu: {
            beforeSelect: function (info) {

            }
            , callback: function (key, sObj) {
              console.log(this, key, sObj);

              if (key == 'copy') {
                gridObj.copyData();
              }
            }
            , items: [
              { key: "refresh", "name": "새로고침" }
              , { key: "copy", "name": "복사", hotkey: 'Ctrl+C' }
              , {
                key: "sql_create", "name": "sql생성"
                , subMenu: [
                  { key: "selectStar", "name": "select *", mode: "selectStar" }
                  , { key: "select", "name": "select column", mode: "select" }
                  , { key: "insert", "name": "insert", mode: "insert" }
                  , { key: "update", "name": "update", mode: "update" }
                  , { key: "delete", "name": "delete", mode: "delete" }
                  , { key: "drop", "name": "drop", mode: "drop" }
                ]
              }
              , {
                key: "create_ddl", "name": "DDL 보기", hotkey: 'Ctrl+shift+C'

              }
              , {
                key: "mybatis-sql_create", "name": "mybatis Sql생성"
                , subMenu: [
                  { key: "mybatis_insert", "name": "insert", mode: "insert", param_yn: 'Y' }
                  , { key: "mybatis_update", "name": "update", mode: "update", param_yn: 'Y' }
                  , { key: "mybatis_delete", "name": "delete", mode: "delete", param_yn: 'Y' }
                ]
              }
              , {
                key: 'export', "name": "내보내기"
                , subMenu: [
                  { key: "export_data", "name": "데이타 내보내기" }
                  , { key: "export_column", "name": "컬럼정보 내보내기" }
                ]
              }
            ]
          }
        }

      }


    });



  }


</script>
